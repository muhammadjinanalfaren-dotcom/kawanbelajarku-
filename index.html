<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login KawanBelajarku</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f6fb;font-family:Arial,sans-serif;color:#172033}
    .card{width:min(100%,420px);background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 35px #17203314}
    h1{margin:0 0 8px;font-size:26px}
    .sub{margin:0 0 24px;color:#65718a;line-height:1.5}
    label{display:block;margin:14px 0 7px;font-weight:600;font-size:14px}
    input{width:100%;padding:13px;border:1px solid #d6dce7;border-radius:10px;font-size:16px}
    button{width:100%;padding:13px;border:0;border-radius:10px;background:#2457d6;color:#fff;font-weight:700;font-size:15px;margin-top:18px;cursor:pointer}
    button.secondary{background:#eaf0ff;color:#2457d6;margin-top:10px}
    button:disabled{opacity:.6;cursor:wait}
    #message{margin-top:16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .muted{color:#65718a;font-size:13px;margin-top:18px}
    .hidden{display:none}
    .pw-wrap{position:relative}
    .pw-wrap input{padding-right:46px}
    button.pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;margin:0;padding:0;background:transparent;color:#65718a;border-radius:8px;display:grid;place-items:center}
    button.pw-toggle:hover{background:#eef2f9;color:#2457d6}
    button.pw-toggle:focus-visible{outline:2px solid #2457d6}
    button.pw-toggle svg{width:20px;height:20px;pointer-events:none}
    button.pw-toggle .ico-off{display:none}
    button.pw-toggle.on .ico-on{display:none}
    button.pw-toggle.on .ico-off{display:block}
    .pill{display:inline-block;padding:5px 10px;background:#edf3ff;color:#2457d6;border-radius:20px;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <h1>KawanBelajarku</h1>
    <p class="sub">Masuk untuk melanjutkan kegiatan belajarmu.</p>

    <section id="auth">
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="nama@email.com">
        <label for="password">Password</label>
        <div class="pw-wrap"><input id="password" type="password" autocomplete="current-password" required placeholder="Password akun"><button type="button" class="pw-toggle" data-target="password" aria-label="Tampilkan password" aria-pressed="false"><svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div>
        <button id="loginBtn" type="submit">Masuk</button>
        <p class="muted" style="text-align:center"><a href="/reset-password.html">Lupa password?</a></p>
      </form>
      <button id="showSignup" class="secondary" type="button">Buat akun siswa</button>
      <form id="signupForm" class="hidden">
        <label for="fullName">Nama lengkap</label>
        <input id="fullName" type="text" autocomplete="name" required placeholder="Nama lengkap">
        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" autocomplete="email" required placeholder="nama@email.com">
        <label for="signupPassword">Password</label>
        <div class="pw-wrap"><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter"><button type="button" class="pw-toggle" data-target="signupPassword" aria-label="Tampilkan password" aria-pressed="false"><svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div>
        <button id="signupBtn" type="submit">Daftar akun</button>
        <button id="backToLogin" class="secondary" type="button">Kembali ke login</button>
      </form>
    </section>

    <section id="account" class="hidden">
      <p>Berhasil masuk ke KawanBelajarku.</p>
      <p id="userName"></p>
      <p>Peran akun: <span id="userRole" class="pill">Memuat...</span></p>
      <p class="muted">Ini halaman awal akun. Fitur materi, progres, dan dashboard akan disambungkan setelah alur login diuji.</p>
      <button id="logoutBtn" type="button">Keluar</button>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    // Tangani dua format link pemulihan Supabase:
    // 1) hash token: #access_token=...&type=recovery
    // 2) PKCE: ?code=...
    // Redirect harus dilakukan sebelum client login dibuat agar sesi recovery
    // tidak sempat dianggap sebagai sesi login biasa dan diarahkan ke dashboard.
    const recoveryHashParams = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    const recoveryQueryParams = new URLSearchParams(location.search || "");
    const IS_RECOVERY =
      recoveryHashParams.get("type") === "recovery" ||
      recoveryQueryParams.has("code");

    if (IS_RECOVERY) {
      location.replace("/reset-password.html" + location.search + location.hash);
    }
    const SUPABASE_URL = "https://zqjsvihbqmmpnrhuvtyc.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7GAjjaWrZBLFjEPuiKCd4A_2dKWgnlM";
    const $ = (id) => document.getElementById(id);
    const message = (text, isError=false) => {
      $("message").textContent = text;
      $("message").style.color = isError ? "#b42318" : "#167447";
    };

    // PERBAIKAN: nama "supabase" bentrok dengan global window.supabase milik library CDN,
    // sehingga seluruh script gagal dan form dikirim biasa (reload). Pakai nama lain.
    let supabaseClient = null;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    } catch (err) {
      console.error("Gagal membuat client Supabase:", err);
      message("Library Supabase gagal dimuat. Muat ulang halaman atau periksa koneksi internet.", true);
    }

    const errText = (err) => (err && err.message) ? err.message : String(err);
    const setBusy = (id, busy, label) => {
      const button = $(id);
      button.disabled = busy;
      if (label) button.textContent = busy ? "Memproses..." : label;
    };

    function showAccount(user, profile) {
      $("auth").classList.add("hidden");
      $("account").classList.remove("hidden");
      $("userName").textContent = profile?.full_name || user.email || "Pengguna";
      $("userRole").textContent = profile?.role || "siswa";
    }

    async function loadAccount(user) {
      try {
        const { data: profile, error } = await supabaseClient
          .from("profiles")
          .select("full_name, role")
          .eq("id", user.id)
          .maybeSingle();

        if (error) {
          showAccount(user, null);
          message("Login berhasil. Profil belum bisa dibaca; periksa policy SELECT profiles jika nama/peran tidak muncul.", true);
          return;
        }
        if (!profile) {
          showAccount(user, null);
          message("Login berhasil, tetapi profil belum ditemukan. Hubungi admin.", true);
          return;
        }
        if (profile.role !== "admin" && profile.role !== "student") {
          showAccount(user, profile);
          message("Role akun tidak dikenali. Hubungi admin.", true);
          return;
        }
        message("Login berhasil. Mengalihkan ke beranda...");
        location.replace("/kawanbelajarku-dashboard.html");
      } catch (err) {
        console.error("loadAccount error:", err);
        showAccount(user, null);
        message("Login berhasil, tetapi terjadi kesalahan saat memuat profil: " + errText(err), true);
      }
    }

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabaseClient) return message("Library Supabase belum siap. Muat ulang halaman.", true);
      setBusy("loginBtn", true, "Masuk");
      message("");
      try {
        const email = $("email").value.trim();
        const password = $("password").value;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          message(error.message, true);
          return;
        }
        if (!data || !data.user) {
          message("Login gagal: data pengguna tidak diterima dari server.", true);
          return;
        }
        await loadAccount(data.user);
      } catch (err) {
        console.error("Login error:", err);
        message("Terjadi kesalahan saat login: " + errText(err), true);
      } finally {
        setBusy("loginBtn", false, "Masuk");
      }
    });

    document.querySelectorAll(".pw-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = $(btn.dataset.target);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.classList.toggle("on", show);
        btn.setAttribute("aria-pressed", String(show));
        btn.setAttribute("aria-label", show ? "Sembunyikan password" : "Tampilkan password");
      });
    });

    $("showSignup").addEventListener("click", () => {
      $("loginForm").classList.add("hidden");
      $("showSignup").classList.add("hidden");
      $("signupForm").classList.remove("hidden");
      message("");
    });

    $("backToLogin").addEventListener("click", () => {
      $("signupForm").classList.add("hidden");
      $("loginForm").classList.remove("hidden");
      $("showSignup").classList.remove("hidden");
      message("");
    });

    $("signupForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabaseClient) return message("Library Supabase belum siap. Muat ulang halaman.", true);
      setBusy("signupBtn", true, "Daftar akun");
      message("");
      try {
        const full_name = $("fullName").value.trim();
        const email = $("signupEmail").value.trim();
        const password = $("signupPassword").value;
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { full_name },
            // Setelah email dikonfirmasi, kembali ke halaman login Netlify ini.
            emailRedirectTo: window.location.origin + "/"
          }
        });
        if (error) {
          message(error.message, true);
          return;
        }
        if (data.session && data.user) {
          await loadAccount(data.user);
        } else {
          message("Pendaftaran diterima. Cek email untuk konfirmasi akun, lalu masuk.");
          $("signupForm").classList.add("hidden");
          $("loginForm").classList.remove("hidden");
          $("showSignup").classList.remove("hidden");
        }
      } catch (err) {
        console.error("Signup error:", err);
        message("Terjadi kesalahan saat mendaftar: " + errText(err), true);
      } finally {
        setBusy("signupBtn", false, "Daftar akun");
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) return message(error.message, true);
        $("account").classList.add("hidden");
        $("auth").classList.remove("hidden");
        $("loginForm").classList.remove("hidden");
        $("showSignup").classList.remove("hidden");
        message("Kamu sudah keluar.");
      } catch (err) {
        console.error("Logout error:", err);
        message("Terjadi kesalahan saat keluar: " + errText(err), true);
      }
    });

    (async () => {
      if (!supabaseClient || IS_RECOVERY) return;
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.user) await loadAccount(session.user);
      } catch (err) {
        console.error("Cek sesi gagal:", err);
        message("Gagal memeriksa sesi: " + errText(err), true);
      }
    })();
  </script>
</body>
</html>
