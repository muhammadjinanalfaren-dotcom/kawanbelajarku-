<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — KawanBelajarku</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f6fb;font-family:Arial,sans-serif;color:#172033}
    .card{width:min(100%,420px);background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 35px #17203314}
    h1{margin:0 0 8px;font-size:26px}
    .sub{margin:0 0 20px;color:#65718a;line-height:1.5}
    label{display:block;margin:14px 0 7px;font-weight:600;font-size:14px}
    input[type=password],input[type=text],input[type=email]{width:100%;padding:13px;border:1px solid #d6dce7;border-radius:10px;font-size:16px}
    .show{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:normal}
    button{width:100%;padding:13px;border:0;border-radius:10px;background:#2457d6;color:#fff;font-weight:700;font-size:15px;margin-top:18px;cursor:pointer}
    button.secondary{background:#eaf0ff;color:#2457d6;margin-top:10px}
    button:disabled{opacity:.6;cursor:wait}
    #message{margin-top:16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .muted{color:#65718a;font-size:13px;margin-top:18px;text-align:center}
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>KawanBelajarku</h1>

    <!-- Memeriksa tautan -->
    <section id="checking">
      <p class="sub">Memeriksa tautan pemulihan...</p>
    </section>

    <!-- Form password baru (hanya muncul jika sesi pemulihan terdeteksi) -->
    <section id="resetSection" class="hidden">
      <p class="sub">Buat password baru untuk akunmu.</p>
      <form id="resetForm">
        <label for="newPassword">Password baru</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter">
        <label for="confirmPassword">Konfirmasi password baru</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulangi password baru">
        <label class="show"><input id="showPw" type="checkbox"> Tampilkan password</label>
        <button id="resetBtn" type="submit">Simpan password baru</button>
      </form>
    </section>

    <!-- Form minta tautan reset (jika halaman dibuka tanpa tautan pemulihan) -->
    <section id="requestSection" class="hidden">
      <p class="sub" id="requestSub">Masukkan email akunmu. Kami kirim tautan untuk membuat password baru.</p>
      <form id="requestForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="nama@email.com">
        <button id="requestBtn" type="submit">Kirim tautan reset</button>
      </form>
    </section>

    <div id="message" role="status" aria-live="polite"></div>
    <p class="muted"><a href="/">Kembali ke halaman login</a></p>
  </main>

  <script>
    // Konfigurasi sama dengan index.html (tidak ada konfigurasi baru).
    const SUPABASE_URL = "https://zqjsvihbqmmpnrhuvtyc.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7GAjjaWrZBLFjEPuiKCd4A_2dKWgnlM";
    const RESET_PAGE_URL = window.location.origin + "/reset-password.html";

    const $ = (id) => document.getElementById(id);
    const message = (text, isError = false) => {
      $("message").textContent = text;
      $("message").style.color = isError ? "#b42318" : "#167447";
    };
    const errText = (err) => (err && err.message) ? err.message : String(err);
    const setBusy = (id, busy, label) => {
      $(id).disabled = busy;
      $(id).textContent = busy ? "Memproses..." : label;
    };
    const show = (id) => {
      ["checking", "resetSection", "requestSection"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
    };

    // Baca info dari URL SEBELUM library Supabase membersihkan hash.
    const hash = window.location.hash || "";
    const hashParams = new URLSearchParams(hash.replace(/^#/, ""));
    const queryParams = new URLSearchParams(window.location.search || "");
    const isRecoveryLink =
      hashParams.get("type") === "recovery" ||
      queryParams.has("code");
    const linkError =
      hashParams.get("error_description") ||
      hashParams.get("error") ||
      queryParams.get("error_description") ||
      queryParams.get("error");

    let supabaseClient = null;
    let recoveryReady = false;

    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    } catch (err) {
      console.error("Gagal membuat client Supabase:", err);
      show("requestSection");
      message("Library Supabase gagal dimuat. Muat ulang halaman atau periksa koneksi internet.", true);
    }

    function showRecoveryForm() {
      recoveryReady = true;
      show("resetSection");
      message("");
    }

    if (supabaseClient) {
      // Supabase memberi event ini saat tautan pemulihan valid dan sesi pemulihan dibuat.
      supabaseClient.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") showRecoveryForm();
      });

      (async () => {
        try {
          if (linkError) {
            show("requestSection");
            $("requestSub").textContent = "Tautan tidak valid atau sudah kedaluwarsa. Minta tautan baru di bawah ini.";
            message("Tautan pemulihan tidak bisa dipakai: " + linkError.replace(/\+/g, " "), true);
            return;
          }
          const { data: { session }, error } = await supabaseClient.auth.getSession();
          if (error) throw error;
          if (isRecoveryLink && session) {
            showRecoveryForm();
          } else if (!recoveryReady) {
            show("requestSection");
            if (isRecoveryLink) {
              $("requestSub").textContent = "Tautan tidak valid atau sudah kedaluwarsa. Minta tautan baru di bawah ini.";
              message("Sesi pemulihan tidak ditemukan. Pastikan tautan dibuka di browser yang sama dan belum kedaluwarsa.", true);
            }
          }
        } catch (err) {
          console.error("Cek sesi pemulihan gagal:", err);
          if (!recoveryReady) show("requestSection");
          message("Gagal memeriksa tautan: " + errText(err), true);
        }
      })();
    }

    $("showPw").addEventListener("change", (e) => {
      const type = e.target.checked ? "text" : "password";
      $("newPassword").type = type;
      $("confirmPassword").type = type;
    });

    // Simpan password baru
    $("resetForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabaseClient) return message("Library Supabase belum siap. Muat ulang halaman.", true);
      const passwordBaru = $("newPassword").value;
      const konfirmasi = $("confirmPassword").value;
      if (passwordBaru.length < 8) return message("Password minimal 8 karakter.", true);
      if (passwordBaru !== konfirmasi) return message("Konfirmasi password tidak sama.", true);

      setBusy("resetBtn", true, "Simpan password baru");
      message("");
      let success = false;
      try {
        const { error } = await supabaseClient.auth.updateUser({ password: passwordBaru });
        if (error) {
          message(error.message, true);
          return;
        }
        success = true;
        message("Password berhasil diubah. Mengarahkan ke halaman login...");
        $("resetForm").classList.add("hidden");
        // Keluar dari sesi pemulihan agar pengguna login dengan password baru.
        try { await supabaseClient.auth.signOut({ scope: "local" }); } catch (e) { console.error(e); }
        setTimeout(() => location.replace("/"), 2000);
      } catch (err) {
        console.error("Update password error:", err);
        message("Terjadi kesalahan: " + errText(err), true);
      } finally {
        if (!success) setBusy("resetBtn", false, "Simpan password baru");
      }
    });

    // Minta tautan reset password
    $("requestForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabaseClient) return message("Library Supabase belum siap. Muat ulang halaman.", true);
      setBusy("requestBtn", true, "Kirim tautan reset");
      message("");
      try {
        const email = $("email").value.trim();
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: RESET_PAGE_URL });
        if (error) {
          message(error.message, true);
          return;
        }
        message("Jika email terdaftar, tautan reset sudah dikirim. Cek inbox atau folder spam.");
      } catch (err) {
        console.error("Kirim reset error:", err);
        message("Terjadi kesalahan: " + errText(err), true);
      } finally {
        setBusy("requestBtn", false, "Kirim tautan reset");
      }
    });
  </script>
</body>
</html>
