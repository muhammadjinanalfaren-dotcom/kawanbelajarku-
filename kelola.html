<script>
const SUPABASE_URL='https://zqjsvihbqmmpnrhuvtyc.supabase.co';

const isAdmin=()=>currentProfile?.role==='admin';

/* ---------- Notifikasi admin ---------- */
function notice(text,isError){
 $('adminNotice').innerHTML=text?`<div class="${isError?'error':'ok'}">${esc(text)}</div>`:'';
}

/* ---------- Mata pelajaran: tampilan ---------- */
function renderSubjects(){
 const el=$('subjects');
 if(!subjectsData.length){el.innerHTML='<div class="empty">Belum ada mata pelajaran.</div>';return;}
 el.innerHTML=subjectsData.map(r=>`<article class="item"><h3>${esc(r.name)}</h3><p>${esc(r.description||'')}</p>${isAdmin()?`<div class="actions"><button class="sbtn" type="button" data-act="edit" data-id="${esc(r.id)}">Edit</button><button class="sbtn danger" type="button" data-act="del" data-id="${esc(r.id)}">Hapus</button></div>`:''}</article>`).join('');
}

function resetSubjectForm(){
 editingSubjectId=null;
 $('subjectForm').reset();
 $('subjectFormTitle').textContent='Tambah mata pelajaran';
 $('subjectSave').textContent='Simpan';
 $('subjectCancel').classList.add('hidden');
}

/* ---------- Mata pelajaran: simpan (tambah / edit) ---------- */
async function saveSubject(event){
 event.preventDefault();
 if(!isAdmin()){notice('Hanya admin yang boleh mengelola mata pelajaran.',true);return;}
 const name=$('subjectName').value.trim();
 const description=$('subjectDesc').value.trim();
 if(!name){notice('Nama mata pelajaran wajib diisi.',true);return;}
 const saveBtn=$('subjectSave');
 const label=saveBtn.textContent;
 saveBtn.disabled=true;saveBtn.textContent='Menyimpan...';
 notice('');
 try{
  const payload={name,description:description||null};
  let res;
  if(editingSubjectId!==null){
   res=await db.from('subjects').update(payload).eq('id',editingSubjectId).select();
  }else{
   res=await db.from('subjects').insert(payload).select();
  }
  if(res.error)throw res.error;
  if(!res.data||!res.data.length)throw new Error('Perubahan tidak tersimpan. Kemungkinan akun ini tidak punya izin admin di database.');
  const wasEdit=editingSubjectId!==null;
  resetSubjectForm();
  await loadData();
  notice(wasEdit?'Mata pelajaran berhasil diperbarui.':'Mata pelajaran berhasil ditambahkan.',false);
 }catch(e){
  console.error('Simpan mata pelajaran gagal:',e);
  notice('Gagal menyimpan: '+(e.message||e),true);
  saveBtn.textContent=label;
 }finally{
  saveBtn.disabled=false;
 }
}

/* ---------- Mata pelajaran: edit ---------- */
function startEditSubject(id){
 const s=subjectsData.find(r=>String(r.id)===String(id));
 if(!s)return;
 editingSubjectId=s.id;
 $('subjectName').value=s.name||'';
 $('subjectDesc').value=s.description||'';
 $('subjectFormTitle').textContent='Edit mata pelajaran';
 $('subjectSave').textContent='Simpan perubahan';
 $('subjectCancel').classList.remove('hidden');
 notice('');
 $('subjectAdmin').scrollIntoView({behavior:'smooth',block:'start'});
 $('subjectName').focus();
}

/* ---------- Mata pelajaran: hapus ---------- */
async function deleteSubject(id){
 const s=subjectsData.find(r=>String(r.id)===String(id));
 if(!s)return;
 notice('');
 try{
  // Cek dulu apakah masih dipakai materi/kuis, agar tidak ada data yang ikut hilang atau gagal tanpa jelas.
  const [m,q]=await Promise.all([
   db.from('materials').select('id',{count:'exact',head:true}).eq('subject_id',s.id),
   db.from('quizzes').select('id',{count:'exact',head:true}).eq('subject_id',s.id)
  ]);
  if(m.error)throw m.error;
  if(q.error)throw q.error;
  const mc=m.count||0,qc=q.count||0;
  if(mc>0||qc>0){
   notice(`"${s.name}" tidak bisa dihapus karena masih memiliki ${mc} materi dan ${qc} kuis. Hapus atau pindahkan dulu isinya.`,true);
   return;
  }
  if(!confirm(`Hapus mata pelajaran "${s.name}"? Tindakan ini tidak bisa dibatalkan.`))return;
  const res=await db.from('subjects').delete().eq('id',s.id).select();
  if(res.error)throw res.error;
  if(!res.data||!res.data.length)throw new Error('Data tidak terhapus. Kemungkinan akun ini tidak punya izin admin di database.');
  if(editingSubjectId!==null&&String(editingSubjectId)===String(s.id))resetSubjectForm();
  await loadData();
  notice('Mata pelajaran berhasil dihapus.',false);
 }catch(e){
  console.error('Hapus mata pelajaran gagal:',e);
  notice('Gagal menghapus: '+(e.message||e),true);
 }
}

  const edited=editingMaterialId!==null;resetMaterialForm();await loadData();materialNotice(edited?'Materi berhasil diperbarui.':'Materi berhasil ditambahkan.',false);

function startEditMaterial(id){
 const m=materialsData.find(x=>String(x.id)===String(id));if(!m)return;
 editingMaterialId=m.id;fillMaterialSubjects(m.subject_id);$('materialTitle').value=m.title||'';$('materialDesc').value=m.description||'';$('materialContent').value=m.content||'';$('materialFormTitle').textContent='Edit materi';$('materialSave').textContent='Simpan perubahan';$('materialCancel').classList.remove('hidden');materialNotice('');$('materialAdmin').scrollIntoView({behavior:'smooth',block:'start'});
}
async function deleteMaterial(id){

 if(!confirm(`Hapus materi "${m.title}"? Tindakan ini tidak bisa dibatalkan.`))return;
 materialNotice('');

  const res=await db.from('materials').delete().eq('id',m.id).select();if(res.error)throw res.error;if(!res.data?.length)throw new Error('Materi tidak terhapus. Periksa izin admin pada tabel materials.');
  if(String(editingMaterialId)===String(m.id))resetMaterialForm();await loadData();materialNotice('Materi berhasil dihapus.',false);
 }catch(e){console.error(e);materialNotice('Gagal menghapus materi: '+(e.message||e),true);}

/* ---------- Kuis: helper ---------- */
function quizNotice(text,isError){$('quizNotice').innerHTML=text?`<div class="${isError?'error':'ok'}">${esc(text)}</div>`:'';}
function questionNotice(text,isError){$('questionNotice').innerHTML=text?`<div class="${isError?'error':'ok'}">${esc(text)}</div>`:'';}
function takerNotice(text,isError){$('takerNotice').innerHTML=text?`<div class="${isError?'error':'ok'}">${esc(text)}</div>`:'';}
function parseOptions(o){
 if(Array.isArray(o))return o.map(x=>String(x??''));
 if(typeof o==='string'){
  try{const j=JSON.parse(o);if(Array.isArray(j))return j.map(x=>String(x??''));if(j&&typeof j==='object')return Object.values(j).map(x=>String(x??''));}catch(e){}
  return o.split('\n').map(x=>x.trim()).filter(Boolean);
 }
 if(o&&typeof o==='object')return Object.values(o).map(x=>String(x??''));
 return [];
}
/* Cari indeks jawaban benar: cocokkan dengan teks pilihan; cadangan: huruf (A,B,..) atau angka indeks (mulai 0). */
function correctIndex(q){
 const opts=parseOptions(q.options);
 const ca=String(q.correct_answer??'').trim();
 if(!ca)return -1;
 let i=opts.findIndex(o=>o.trim().toLowerCase()===ca.toLowerCase());
 if(i>=0)return i;
 if(/^[A-Za-z]$/.test(ca)){i=ca.toUpperCase().charCodeAt(0)-65;return i<opts.length?i:-1;}
 if(/^\d+$/.test(ca)){i=parseInt(ca,10);return i<opts.length?i:-1;}
 return -1;
}
const quizById=id=>quizzesData.find(q=>String(q.id)===String(id));

 const el=$('quizSubject');
 el.innerHTML='<option value="">Pilih mata pelajaran</option>'+subjectsData.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
 el.value=selected==null?'':String(selected);
}
function lastResult(quizId){
 return resultsData.find(r=>String(r.quiz_id)===String(quizId))||null; // resultsData sudah urut terbaru
}

async function saveQuiz(event){
 event.preventDefault();
 if(!isAdmin()){quizNotice('Hanya admin yang boleh mengelola kuis.',true);return;}
 const subject_id=$('quizSubject').value,title=$('quizTitle').value.trim(),description=$('quizDesc').value.trim();
 if(!subject_id||!title){quizNotice('Mata pelajaran dan judul kuis wajib diisi.',true);return;}
 const btn=$('quizSave'),old=btn.textContent;btn.disabled=true;btn.textContent='Menyimpan...';quizNotice('');
 try{
  const payload={subject_id,title,description:description||null};
  const res=editingQuizId!==null?await db.from('quizzes').update(payload).eq('id',editingQuizId).select():await db.from('quizzes').insert(payload).select();
  if(res.error)throw res.error;
  if(!res.data?.length)throw new Error('Kuis tidak tersimpan. Periksa izin admin pada tabel quizzes.');
  const edited=editingQuizId!==null;resetQuizForm();await loadData();quizNotice(edited?'Kuis berhasil diperbarui.':'Kuis berhasil ditambahkan. Klik "Kelola pertanyaan" untuk mengisi pertanyaannya.',false);
 }catch(e){console.error(e);quizNotice('Gagal menyimpan kuis: '+(e.message||e),true);btn.textContent=old;}
 finally{btn.disabled=false;}
}
function startEditQuiz(id){
 const q=quizById(id);if(!q)return;
 editingQuizId=q.id;fillQuizSubjects(q.subject_id);$('quizTitle').value=q.title||'';$('quizDesc').value=q.description||'';
 $('quizFormTitle').textContent='Edit kuis';$('quizSave').textContent='Simpan perubahan';$('quizCancel').classList.remove('hidden');quizNotice('');
 $('quizAdmin').scrollIntoView({behavior:'smooth',block:'start'});
}
async function deleteQuiz(id){
 const q=quizById(id);if(!q)return;
 quizNotice('');
 try{
  const [qs,rs]=await Promise.all([
   db.from('questions').select('quiz_id',{count:'exact',head:true}).eq('quiz_id',q.id),
   db.from('quiz_results').select('id',{count:'exact',head:true}).eq('quiz_id',q.id)
  ]);
  if(qs.error)throw qs.error;
  if(rs.error)throw rs.error;
  const qc=qs.count||0,rc=rs.count||0;
  if(rc>0){quizNotice(`"${q.title}" tidak bisa dihapus karena sudah dikerjakan siswa (${rc} hasil tersimpan).`,true);return;}
  if(!confirm(`Hapus kuis "${q.title}"${qc?` beserta ${qc} pertanyaannya`:''}? Tindakan ini tidak bisa dibatalkan.`))return;
  if(qc>0){
   const dq=await db.from('questions').delete().eq('quiz_id',q.id).select();
   if(dq.error)throw dq.error;
   if(!dq.data?.length)throw new Error('Pertanyaan tidak terhapus. Periksa izin admin pada tabel questions.');
  }
  const res=await db.from('quizzes').delete().eq('id',q.id).select();
  if(res.error)throw res.error;
  if(!res.data?.length)throw new Error('Kuis tidak terhapus. Periksa izin admin pada tabel quizzes.');
  if(String(editingQuizId)===String(q.id))resetQuizForm();
  if(String(managingQuizId)===String(q.id))closeQuestionPanel();
  await loadData();quizNotice('Kuis berhasil dihapus.',false);
 }catch(e){console.error(e);quizNotice('Gagal menghapus kuis: '+(e.message||e),true);}
}

/* ---------- Pertanyaan: admin ---------- */
function readOptionRows(){
 const rows=[...document.querySelectorAll('#optionRows .opt-row')];
 const checked=rows.findIndex(r=>r.querySelector('input[type=radio]').checked);
 return {values:rows.map(r=>r.querySelector('input[type=text]').value),correct:checked};
}
function renderOptionRows(values,correct){
 const box=$('optionRows');
 box.innerHTML=values.map((v,i)=>`<div class="opt-row"><input type="radio" name="correctOpt" value="${i}" ${i===correct?'checked':''} aria-label="Jawaban benar ${i+1}"><input type="text" maxlength="300" value="${esc(v)}" placeholder="Pilihan ${i+1}" aria-label="Pilihan ${i+1}">${values.length>2?`<button class="sbtn danger" type="button" data-opt-del="${i}" aria-label="Hapus pilihan ${i+1}">✕</button>`:''}</div>`).join('');
}
function resetQuestionForm(){
 editingQuestionIdx=null;$('questionForm').reset();
 $('questionFormTitle').textContent='Tambah pertanyaan';$('questionSave').textContent='Simpan pertanyaan';$('questionCancel').classList.add('hidden');
 renderOptionRows(['','','',''],-1);
}
function renderQuestionList(){
 const el=$('questionList');
 if(!questionsData.length){el.innerHTML='<div class="empty">Belum ada pertanyaan untuk kuis ini.</div>';return;}
 el.innerHTML=questionsData.map((q,i)=>{
  const opts=parseOptions(q.options),ci=correctIndex(q);
  return `<div class="qitem"><b>${i+1}. ${esc(q.question_text)}</b><ol type="A">${opts.map((o,j)=>`<li class="${j===ci?'right':''}">${esc(o)}${j===ci?' ✓':''}</li>`).join('')}</ol>${ci<0?'<div class="qwarn">Kunci jawaban tidak cocok dengan pilihan. Edit pertanyaan ini.</div>':''}<div class="actions"><button class="sbtn" type="button" data-q-act="edit" data-i="${i}">Edit</button><button class="sbtn danger" type="button" data-q-act="del" data-i="${i}">Hapus</button></div></div>`;
 }).join('');
}
async function loadQuestions(quizId){
 const res=await db.from('questions').select('question_text,options,correct_answer,quiz_id').eq('quiz_id',quizId);
 if(res.error)throw res.error;
 return res.data||[];
}
async function openQuestionPanel(id){
 const q=quizById(id);if(!q||!isAdmin())return;
 managingQuizId=q.id;resetQuestionForm();questionNotice('');
 $('questionPanelTitle').textContent='Pertanyaan: '+q.title;
 $('questionAdmin').classList.remove('hidden');
 $('questionList').innerHTML='<div class="empty">Memuat pertanyaan…</div>';
 $('questionAdmin').scrollIntoView({behavior:'smooth',block:'start'});
 try{questionsData=await loadQuestions(q.id);renderQuestionList();}
 catch(e){console.error(e);questionsData=[];$('questionList').innerHTML='';questionNotice('Gagal memuat pertanyaan: '+(e.message||e),true);}
}
function closeQuestionPanel(){managingQuizId=null;questionsData=[];resetQuestionForm();questionNotice('');$('questionAdmin').classList.add('hidden');}
function startEditQuestion(i){
 const q=questionsData[i];if(!q)return;
 editingQuestionIdx=i;
 const opts=parseOptions(q.options);while(opts.length<2)opts.push('');
 $('questionText').value=q.question_text||'';
 renderOptionRows(opts,correctIndex(q));
 $('questionFormTitle').textContent='Edit pertanyaan';$('questionSave').textContent='Simpan perubahan';$('questionCancel').classList.remove('hidden');questionNotice('');
 $('questionForm').scrollIntoView({behavior:'smooth',block:'start'});
}
async function saveQuestion(event){
 event.preventDefault();
 if(!isAdmin()){questionNotice('Hanya admin yang boleh mengelola pertanyaan.',true);return;}
 if(managingQuizId===null){questionNotice('Pilih kuis terlebih dahulu.',true);return;}
 const question_text=$('questionText').value.trim();
 const {values,correct}=readOptionRows();
 if(!question_text){questionNotice('Teks pertanyaan wajib diisi.',true);return;}
 if(correct<0){questionNotice('Pilih jawaban yang benar dengan bulatan di samping pilihan.',true);return;}
 if(!values[correct].trim()){questionNotice('Pilihan yang ditandai benar tidak boleh kosong.',true);return;}
 const options=values.map(v=>v.trim()).filter(Boolean);
 if(options.length<2){questionNotice('Minimal 2 pilihan jawaban.',true);return;}
 if(new Set(options.map(o=>o.toLowerCase())).size!==options.length){questionNotice('Pilihan jawaban tidak boleh sama.',true);return;}
 const correct_answer=values[correct].trim();
 const orig=editingQuestionIdx!==null?questionsData[editingQuestionIdx]:null;
 if(questionsData.some((q,i)=>i!==editingQuestionIdx&&String(q.question_text).trim().toLowerCase()===question_text.toLowerCase())){questionNotice('Pertanyaan yang sama sudah ada di kuis ini.',true);return;}
 const btn=$('questionSave'),old=btn.textContent;btn.disabled=true;btn.textContent='Menyimpan...';questionNotice('');
 try{
  const base={quiz_id:managingQuizId,question_text,correct_answer};
  const run=opts=>{
   const payload={...base,options:opts};
   return orig?db.from('questions').update(payload).eq('quiz_id',orig.quiz_id).eq('question_text',orig.question_text).select():db.from('questions').insert(payload).select();
  };
  let res=await run(options);
  if(res.error){
   // Cadangan: jika kolom options bertipe teks, simpan sebagai JSON string.
   const retry=await run(JSON.stringify(options));
   if(retry.error)throw res.error;
   res=retry;
  }
  if(!res.data?.length)throw new Error('Pertanyaan tidak tersimpan. Periksa izin admin pada tabel questions.');
  const edited=!!orig;
  questionsData=await loadQuestions(managingQuizId);
  resetQuestionForm();renderQuestionList();
  questionNotice(edited?'Pertanyaan berhasil diperbarui.':'Pertanyaan berhasil ditambahkan.',false);
 }catch(e){console.error(e);questionNotice('Gagal menyimpan pertanyaan: '+(e.message||e),true);btn.textContent=old;}
 finally{btn.disabled=false;}
}
async function deleteQuestion(i){
 const q=questionsData[i];if(!q||!isAdmin())return;
 if(!confirm(`Hapus pertanyaan "${q.question_text}"?`))return;
 questionNotice('');
 try{
  const res=await db.from('questions').delete().eq('quiz_id',q.quiz_id).eq('question_text',q.question_text).select();
  if(res.error)throw res.error;
  if(!res.data?.length)throw new Error('Pertanyaan tidak terhapus. Periksa izin admin pada tabel questions.');
  questionsData=await loadQuestions(managingQuizId);
  resetQuestionForm();renderQuestionList();questionNotice('Pertanyaan berhasil dihapus.',false);
 }catch(e){console.error(e);questionNotice('Gagal menghapus pertanyaan: '+(e.message||e),true);}
}

/* ---------- Siswa: mengerjakan kuis ---------- */
async function startQuiz(id){
 if(isAdmin())return;
 const q=quizById(id);if(!q)return;
 takingQuizId=q.id;takingQuestions=[];takerNotice('');
 $('takerTitle').textContent=q.title;$('takerDesc').textContent=q.description||'';
 $('takerQuestions').innerHTML='<div class="empty">Memuat pertanyaan…</div>';
 $('takerSubmit').classList.remove('hidden');$('takerSubmit').disabled=true;
 $('quizTaker').classList.remove('hidden');
 $('quizTaker').scrollIntoView({behavior:'smooth',block:'start'});
 try{
  const qs=await loadQuestions(q.id);
  const valid=qs.filter(x=>parseOptions(x.options).length>=2&&correctIndex(x)>=0);
  if(!valid.length){$('takerQuestions').innerHTML='<div class="empty">Kuis ini belum memiliki pertanyaan yang siap dikerjakan.</div>';$('takerSubmit').classList.add('hidden');return;}
  takingQuestions=valid;
  if(valid.length<qs.length)takerNotice(`${qs.length-valid.length} pertanyaan dilewati karena datanya belum lengkap. Hubungi admin.`,true);
  $('takerQuestions').innerHTML=valid.map((x,i)=>`<div class="qitem"><b>${i+1}. ${esc(x.question_text)}</b>${parseOptions(x.options).map((o,j)=>`<label class="choice"><input type="radio" name="ans${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</div>`).join('');
  $('takerSubmit').disabled=false;
 }catch(e){console.error(e);$('takerQuestions').innerHTML='';$('takerSubmit').classList.add('hidden');takerNotice('Gagal memuat pertanyaan: '+(e.message||e),true);}
}
function closeTaker(){takingQuizId=null;takingQuestions=[];$('quizTaker').classList.add('hidden');$('takerQuestions').innerHTML='';takerNotice('');}
async function submitQuiz(event){
 event.preventDefault();
 if(isAdmin()||takingQuizId===null||!takingQuestions.length)return;
 const answers=takingQuestions.map((_,i)=>{const c=document.querySelector(`input[name="ans${i}"]:checked`);return c?parseInt(c.value,10):-1;});
 const missing=answers.findIndex(a=>a<0);
 if(missing>=0){takerNotice(`Pertanyaan nomor ${missing+1} belum dijawab. Jawab semua pertanyaan dulu.`,true);return;}
 let right=0;
 takingQuestions.forEach((x,i)=>{if(answers[i]===correctIndex(x))right++;});
 const total=takingQuestions.length,score=Math.round(right/total*100);
 const btn=$('takerSubmit');btn.disabled=true;btn.textContent='Menyimpan...';takerNotice('');
 try{
  const res=await db.from('quiz_results').insert({student_id:currentUser.id,quiz_id:takingQuizId,score,completed_at:new Date().toISOString()}).select();
  if(res.error)throw res.error;
  if(!res.data?.length)throw new Error('Skor tidak tersimpan. Periksa izin siswa pada tabel quiz_results.');
  // Tampilkan hasil per soal, kunci tampilan agar tidak dikirim dua kali.
  document.querySelectorAll('#takerQuestions .qitem').forEach((box,i)=>{
   const ci=correctIndex(takingQuestions[i]);
   box.querySelectorAll('label.choice').forEach((lb,j)=>{
    lb.querySelector('input').disabled=true;
    if(j===ci)lb.classList.add('right');
    else if(j===answers[i])lb.classList.add('wrong');
   });
  });
  btn.classList.add('hidden');
  $('takerNotice').innerHTML=`<div class="ok"><div class="score">${score}</div>Benar ${right} dari ${total} pertanyaan. Skor sudah tersimpan.</div>`;
  $('takerNotice').scrollIntoView({behavior:'smooth',block:'nearest'});
  await loadData();
 }catch(e){console.error(e);takerNotice('Gagal menyimpan skor: '+(e.message||e),true);}
 finally{btn.disabled=false;btn.textContent='Kumpulkan jawaban';}
}

/* ---------- Muat data dashboard ---------- */
async function loadData(){
 $('message').innerHTML='';
 db.from('features').select('id,title,description,icon,theme').order('created_at').then(r=>{const l=r.data||[];$('featSection').hidden=!l.length;$('features').innerHTML=KB.featCards(l);});
 const results=await Promise.all([
  db.from('subjects').select('id,name,description,created_at').order('created_at',{ascending:false}),
  db.from('materials').select('id,subject_id,title,description,content,created_at').order('created_at',{ascending:false}),
  db.from('quizzes').select('id,subject_id,title,description,created_at').order('created_at',{ascending:false})
 ]);
 const names=['Mata pelajaran','Materi','Kuis'];
 results.forEach((r,i)=>{if(r.error){$('message').innerHTML+=`<div class="error">Gagal memuat ${names[i]}: ${esc(r.error.message)}</div>`;}});
 subjectsData=results[0].data||[];
 materialsData=results[1].data||[];const materials=materialsData,quizzes=results[2].data||[];quizzesData=quizzes;resultsData=[];
 $('subjectCount').textContent=subjectsData.length;$('materialCount').textContent=materials.length;$('quizCount').textContent=quizzes.length;
 renderSubjects();
 fillMaterialSubjects(editingMaterialId!==null?$('materialSubject').value:'');
 renderMaterials();
 fillQuizSubjects(editingQuizId!==null?$('quizSubject').value:'');
 if(isAdmin()){
  renderQuizzes();
  $('progressStat').classList.add('hidden');
  $('adminInfo').textContent=`Data yang berhasil dimuat: ${subjectsData.length} mata pelajaran, ${materials.length} materi, dan ${quizzes.length} kuis. Pengelolaan mata pelajaran, materi, dan kuis (termasuk pertanyaan dan pilihan jawaban) sudah aktif. Data siswa belum diaktifkan.`;
 }else{
  const {data:progress,error}=await db.from('progress').select('id,student_id,material_id,completed,updated_at').eq('student_id',currentUser.id).eq('completed',true);
  if(error){$('progressCount').textContent='—';$('message').innerHTML+=`<div class="error">Progress belum bisa dibaca: ${esc(error.message)}</div>`;}
  else $('progressCount').textContent=(progress||[]).length;
  const rr=await db.from('quiz_results').select('id,student_id,quiz_id,score,completed_at').eq('student_id',currentUser.id).order('completed_at',{ascending:false});
  if(rr.error)$('message').innerHTML+=`<div class="error">Skor kuis belum bisa dibaca: ${esc(rr.error.message)}</div>`;
  else resultsData=rr.data||[];
  renderQuizzes();
 }
}

async function start(){
 const {data:{session},error:sessionError}=await db.auth.getSession();
 if(sessionError||!session){location.replace('/');return;}
 const user=session.user;
 const {data:profile,error:profileError}=await db.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();
 if(profileError){$('message').innerHTML=`<div class="error">Gagal membaca profil: ${esc(profileError.message)}</div>`;return;}
 if(!profile){$('message').innerHTML='<div class="error">Profil akun belum ditemukan. Hubungi admin.</div>';return;}
 if(profile.role!=='admin'){location.replace('/kawanbelajarku-dashboard.html');return;}currentUser=user;currentProfile=profile;
 $('hello').textContent=`Halo, ${profile.full_name||'Pengguna'}!`;
 $('roleLabel').textContent=profile.role==='admin'?'Dashboard Admin':'Dashboard Siswa';
 const adm=profile.role==='admin';
 ['adminSection','subjectAdmin','materialAdmin','quizAdmin','questionAdmin'].forEach(id=>{const n=document.getElementById(id);if(!n)return;if(adm){if(id!=='questionAdmin')n.classList.remove('hidden');}else n.remove();});
 $('editorLink').hidden=!adm;
 await KB.load(db);
 await loadData();
}

$('subjectForm').addEventListener('submit',saveSubject);
$('materialForm').addEventListener('submit',saveMaterial);
$('materialCancel').addEventListener('click',()=>{resetMaterialForm();materialNotice('');});
$('materials').addEventListener('click',e=>{const b=e.target.closest('button[data-material-act]');if(!b)return;if(b.dataset.materialAct==='edit')startEditMaterial(b.dataset.id);else if(b.dataset.materialAct==='del')deleteMaterial(b.dataset.id);});
$('quizForm').addEventListener('submit',saveQuiz);
$('quizCancel').addEventListener('click',()=>{resetQuizForm();quizNotice('');});
$('quizzes').addEventListener('click',e=>{const b=e.target.closest('button[data-quiz-act]');if(!b)return;const a=b.dataset.quizAct;if(a==='edit')startEditQuiz(b.dataset.id);else if(a==='del')deleteQuiz(b.dataset.id);else if(a==='questions')openQuestionPanel(b.dataset.id);else if(a==='take')startQuiz(b.dataset.id);});
$('questionForm').addEventListener('submit',saveQuestion);
$('questionCancel').addEventListener('click',()=>{resetQuestionForm();questionNotice('');});
$('questionClose').addEventListener('click',closeQuestionPanel);
$('addOption').addEventListener('click',()=>{const {values,correct}=readOptionRows();if(values.length>=6){questionNotice('Maksimal 6 pilihan jawaban.',true);return;}values.push('');renderOptionRows(values,correct);});
$('optionRows').addEventListener('click',e=>{const b=e.target.closest('button[data-opt-del]');if(!b)return;const {values,correct}=readOptionRows();const i=parseInt(b.dataset.optDel,10);values.splice(i,1);renderOptionRows(values,correct===i?-1:(correct>i?correct-1:correct));});
$('questionList').addEventListener('click',e=>{const b=e.target.closest('button[data-q-act]');if(!b)return;if(b.dataset.qAct==='edit')startEditQuestion(parseInt(b.dataset.i,10));else if(b.dataset.qAct==='del')deleteQuestion(parseInt(b.dataset.i,10));});
$('takerForm').addEventListener('submit',submitQuiz);
$('takerClose').addEventListener('click',closeTaker);
$('subjectCancel').addEventListener('click',()=>{resetSubjectForm();notice('');});
$('subjects').addEventListener('click',e=>{
 const btn=e.target.closest('button[data-act]');
 if(!btn)return;
 if(btn.dataset.act==='edit')startEditSubject(btn.dataset.id);
 else if(btn.dataset.act==='del')deleteSubject(btn.dataset.id);
});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.replace('/');});
renderOptionRows(['','','',''],-1);
start().catch(e=>{$('message').innerHTML=`<div class="error">Terjadi kesalahan: ${esc(e.message||e)}</div>`;});
</script>
