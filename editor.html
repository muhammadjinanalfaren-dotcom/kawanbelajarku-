<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor Admin — KawanBelajarku</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kb-shared.js"></script>
<style>
:root{--brand:#2E5A99;--ink:#1B2333;--ink3:#74809A;--line:#E1E6EE}
*{box-sizing:border-box}button,input,select,textarea{font-family:inherit}
body{margin:0;background:#F2F4F7;color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header b{flex:1;font-size:18px}header a,header button{color:#fff;background:#ffffff2e;border:0;border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;max-width:820px;margin:auto}
nav button{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:820px;margin:auto;padding:0 16px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.card h2{margin:0 0 4px;font-size:19px}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d6dce7;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:100px}
.btn{border:1px solid #c9d6ea;background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;margin:12px 8px 0 0}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.d{color:#B3372B;border-color:#e6bcbc}.btn:disabled{opacity:.6}
.icons,.themes{display:flex;flex-wrap:wrap;gap:8px}
.ib{width:58px;height:58px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:4px;cursor:pointer}.ib[aria-pressed=true]{border-color:var(--brand);background:#E4ECF8}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.row{display:flex;align-items:center;gap:12px}.row>div{flex:1;min-width:0}.row small,.hint{color:var(--ink3);font-size:13px}
.pv{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none}
.warn{background:#FFF4D8;color:#6B4A00;padding:12px 14px;border-radius:12px;margin-top:12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;max-width:92vw;z-index:20}
</style>
</head>
<body>
<header><b data-kb-name>KawanBelajarku</b><a href="/kawanbelajarku-dashboard.html">Beranda</a><a href="/kelola.html">Kelola data</a><a href="/pelajaran.html">Lihat sebagai siswa</a><button id="out" type="button">Keluar</button></header>
<nav><button data-tab="ui">Tampilan</button><button data-tab="ico">Ikon mapel</button><button data-tab="fea">Fitur</button><button data-tab="att">File &amp; video</button></nav>
<main>
<div class="warn" id="miss" hidden>Tabel editor belum ada di database. Jalankan <b>supabase-setup.sql</b> di Supabase → SQL Editor, lalu muat ulang halaman ini.</div>
<div id="main"></div>
</main>
<div id="toast" hidden></div>
<script>
const db=window.supabase.createClient('https://zqjsvihbqmmpnrhuvtyc.supabase.co','sb_publishable_7GAjjaWrZBLFjEPuiKCd4A_2dKWgnlM');
const $=id=>document.getElementById(id),esc=KB.esc,I=KB.icon;
const S={sub:[],mat:[],fea:[],att:[],miss:false};
let tab='ui',AT='',F={icon:'star',theme:'sky'};
const toast=(m,bad)=>{const t=$('toast');t.textContent=m;t.style.background=bad?'#B3372B':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};
const sw=(cur,a)=>Object.entries(KB.THEMES).map(([k,v])=>`<button type="button" class="sw" ${a}="${k}" style="background:${v.deep}" aria-pressed="${cur===k}" aria-label="Warna ${k}"></button>`).join('');
const ib=(cur,a)=>Object.keys(KB.ICONS).filter(k=>k!=='bookmark').map(k=>`<button type="button" class="ib" ${a}="${k}" aria-pressed="${cur===k}" aria-label="Ikon ${k}">${I(k,46)}</button>`).join('');
const subName=id=>S.sub.find(s=>String(s.id)===String(id))?.name||'';

function pUI(){const u=KB.cfg.ui||{};return`<div class="card"><h2>Tampilan situs</h2><p class="hint">Berlaku untuk semua siswa di Beranda dan Pelajaran.</p><label for="uN">Nama situs</label><input id="uN" maxlength="40" value="${esc(u.name||'KawanBelajarku')}"><label for="uC">Warna utama</label><input id="uC" type="color" value="${u.color||'#2E5A99'}" style="height:48px;padding:4px"><label for="uW">Teks sambutan di Beranda</label><textarea id="uW" maxlength="300" placeholder="Contoh: Selamat belajar! Jangan lupa kerjakan kuis minggu ini.">${esc(u.welcome||'')}</textarea><button class="btn p" data-a="ui">Simpan tampilan</button><button class="btn" data-a="uiReset">Kembalikan bawaan</button></div>`}
function pIco(){if(!S.sub.length)return'<div class="card">Belum ada mata pelajaran. Tambahkan dulu di Beranda.</div>';return S.sub.map(s=>{const a=KB.auto(s),o=KB.cfg.style[s.id]||{},ic=o.icon||a.icon,th=o.theme||a.theme;return`<div class="card" data-sid="${esc(s.id)}"><div class="row"><span class="pv" style="background:${KB.THEMES[th].bg}">${I(ic,52)}</span><div><b>${esc(s.name)}</b><br><small>${o.icon||o.theme?'Diubah admin':'Otomatis'}</small></div><button class="btn" style="margin:0" data-a="icoReset" data-id="${esc(s.id)}">Otomatis</button></div><label>Ikon</label><div class="icons">${ib(ic,'data-ic')}</div><label>Warna</label><div class="themes">${sw(th,'data-th')}</div></div>`}).join('')+'<button class="btn p" data-a="icoSave">Simpan ikon &amp; warna</button>'}
function pFea(){const f=F;return`<div class="card"><h2>${f.id?'Edit fitur':'Tambah fitur'}</h2><p class="hint">Fitur baru muncul sebagai kartu di Beranda dan Pelajaran.</p><label for="fT">Nama fitur</label><input id="fT" maxlength="80" value="${esc(f.title||'')}"><label for="fD">Deskripsi singkat</label><input id="fD" maxlength="160" value="${esc(f.description||'')}"><label>Ikon</label><div class="icons">${ib(f.icon,'data-fi')}</div><label>Warna</label><div class="themes">${sw(f.theme,'data-ft')}</div><label for="fC">Isi fitur</label><textarea id="fC" style="min-height:160px" placeholder="Tulis isi. Awali baris dengan # untuk judul, atau - untuk daftar.">${esc(f.content||'')}</textarea><button class="btn p" data-a="fSave">${f.id?'Simpan perubahan':'Tambah fitur'}</button>${f.id?'<button class="btn" data-a="fCancel">Batal</button>':''}</div>`+S.fea.map(x=>`<div class="card row"><span class="pv" style="background:${(KB.THEMES[x.theme]||KB.THEMES.sky).bg}">${I(x.icon,52)}</span><div><b>${esc(x.title)}</b><br><small>${esc(x.description||'')}</small></div><div style="flex:none"><button class="btn" style="margin:0 6px 6px 0" data-a="fEdit" data-id="${esc(x.id)}">Edit</button><button class="btn" style="margin:0 6px 6px 0" data-a="fAtt" data-id="${esc(x.id)}">File</button><button class="btn d" style="margin:0" data-a="fDel" data-id="${esc(x.id)}">Hapus</button></div></div>`).join('')}
function pAtt(){const o=S.mat.map(m=>`<option value="material:${esc(m.id)}">Materi · ${esc(m.title)}${subName(m.subject_id)?' ('+esc(subName(m.subject_id))+')':''}</option>`).join('')+S.fea.map(f=>`<option value="feature:${esc(f.id)}">Fitur · ${esc(f.title)}</option>`).join('');
 const l=S.att.filter(a=>`${a.owner_type}:${a.owner_id}`===AT);
 return`<div class="card"><h2>File, video &amp; tautan</h2><p class="hint">Tampil di halaman materi atau fitur yang dipilih.</p><label for="aT">Tempel pada</label><select id="aT"><option value="">Pilih materi atau fitur</option>${o}</select>`+(AT?`<label for="aK">Jenis</label><select id="aK"><option value="file">Upload file (PDF, dokumen, gambar)</option><option value="videoup">Upload video (mp4)</option><option value="video">Video YouTube / tautan video</option><option value="link">Tautan biasa</option></select><label for="aN">Judul</label><input id="aN" maxlength="120" placeholder="Contoh: Rangkuman Bab 1"><div id="aU"><label for="aUrl">Tautan (URL)</label><input id="aUrl" type="url" placeholder="https://..."></div><div id="aF"><label for="aFile">Pilih file (maks. 50 MB)</label><input id="aFile" type="file"></div><button class="btn p" data-a="aAdd">Tambah</button>`:'')+'</div>'+l.map(a=>`<div class="card">${KB.attView(a)}<button class="btn d" style="margin-top:0" data-a="aDel" data-id="${esc(a.id)}">Hapus</button></div>`).join('')}
function kindUI(){const k=$('aK')?.value;if(!k)return;const up=k==='file'||k==='videoup';$('aU').hidden=up;$('aF').hidden=!up;$('aFile').accept=k==='videoup'?'video/*':''}
function render(){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));$('miss').hidden=!S.miss;$('main').innerHTML=({ui:pUI,ico:pIco,fea:pFea,att:pAtt})[tab]();if(tab==='att'){$('aT').value=AT;kindUI()}}
const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
function syncF(){if($('fT')){F.title=$('fT').value;F.description=$('fD').value;F.content=$('fC').value}}
async function refresh(){const q=t=>db.from(t).select('*').order('created_at');const [s,m,f,a]=await Promise.all([q('subjects'),q('materials'),q('features'),q('attachments')]);S.sub=s.data||[];S.mat=m.data||[];S.fea=f.data||[];S.att=a.data||[];S.miss=!!(KB.missing||f.error||a.error);render()}
const chk=r=>{if(r.error)throw r.error;return r};

$('main').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 try{
 if(d.ic||d.th){const sid=b.closest('[data-sid]').dataset.sid;KB.cfg.style[sid]={...(KB.cfg.style[sid]||{}),...(d.ic?{icon:d.ic}:{theme:d.th})};return keep()}
 if(d.fi||d.ft){syncF();d.fi?F.icon=d.fi:F.theme=d.ft;return keep()}
 const a=d.a;if(!a)return;
 if(a==='ui'){const v={name:$('uN').value.trim(),color:$('uC').value,welcome:$('uW').value.trim()};chk(await KB.save(db,'ui',v));KB.cfg.ui=v;KB.applyUI();toast('Tampilan disimpan')}
 else if(a==='uiReset'){chk(await KB.save(db,'ui',{}));KB.cfg.ui={};location.reload()}
 else if(a==='icoReset'){delete KB.cfg.style[d.id];keep()}
 else if(a==='icoSave'){chk(await KB.save(db,'style',KB.cfg.style));toast('Ikon & warna disimpan')}
 else if(a==='fSave'){syncF();if(!(F.title||'').trim())return toast('Nama fitur wajib diisi',1);const p={title:F.title.trim(),description:(F.description||'').trim()||null,icon:F.icon,theme:F.theme,content:(F.content||'').trim()||null};chk(F.id?await db.from('features').update(p).eq('id',F.id):await db.from('features').insert(p));F={icon:'star',theme:'sky'};await refresh();toast('Fitur disimpan')}
 else if(a==='fCancel'){F={icon:'star',theme:'sky'};keep()}
 else if(a==='fEdit'){F={...S.fea.find(x=>String(x.id)===d.id)};render();scrollTo(0,0)}
 else if(a==='fAtt'){tab='att';AT='feature:'+d.id;render();scrollTo(0,0)}
 else if(a==='fDel'){if(!confirm('Hapus fitur ini beserta lampirannya?'))return;const l=S.att.filter(x=>x.owner_type==='feature'&&String(x.owner_id)===d.id);const ps=l.map(x=>x.path).filter(Boolean);if(ps.length)await db.storage.from('media').remove(ps);chk(await db.from('attachments').delete().eq('owner_type','feature').eq('owner_id',d.id));chk(await db.from('features').delete().eq('id',d.id));await refresh();toast('Fitur dihapus')}
 else if(a==='aAdd'){const k=$('aK').value,[ot,oid]=AT.split(':'),up=k==='file'||k==='videoup';let url=$('aUrl').value.trim(),path=null,f=null;
  if(up){f=$('aFile').files[0];if(!f)return toast('Pilih file dulu',1);if(f.size>52428800)return toast('File lebih dari 50 MB. Untuk video besar, pakai tautan YouTube.',1);b.disabled=true;toast('Mengunggah…');path=`${ot}/${oid}/${Date.now()}-${f.name.replace(/[^\w.-]+/g,'_')}`;chk(await db.storage.from('media').upload(path,f,{contentType:f.type||undefined}));url=db.storage.from('media').getPublicUrl(path).data.publicUrl}
  else if(!/^https?:\/\//i.test(url))return toast('Tautan harus diawali https://',1);
  chk(await db.from('attachments').insert({owner_type:ot,owner_id:oid,kind:k==='videoup'?'video':k,title:$('aN').value.trim()||f?.name||'Lampiran',url,path}));await refresh();toast('Lampiran ditambahkan')}
 else if(a==='aDel'){if(!confirm('Hapus lampiran ini?'))return;const x=S.att.find(y=>String(y.id)===d.id);if(x?.path)await db.storage.from('media').remove([x.path]);chk(await db.from('attachments').delete().eq('id',d.id));await refresh();toast('Lampiran dihapus')}
 }catch(err){console.error(err);toast('Gagal: '+(err.message||err),1);b.disabled=false}
});
$('main').addEventListener('change',e=>{if(e.target.id==='aT'){AT=e.target.value;render()}else if(e.target.id==='aK')kindUI()});
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){syncF();tab=b.dataset.tab;render()}});
$('out').addEventListener('click',async()=>{await db.auth.signOut();location.replace('/')});

(async()=>{
 const {data:{session}}=await db.auth.getSession();if(!session)return location.replace('/');
 const {data:p}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
 if(!p||p.role!=='admin')return location.replace('/kawanbelajarku-dashboard.html');
 await KB.load(db);await refresh();
})().catch(e=>toast('Terjadi kesalahan: '+(e.message||e),1));
</script>
</body>
</html>
