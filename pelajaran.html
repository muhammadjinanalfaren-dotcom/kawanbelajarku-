<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">
<title>Pelajaran — KawanBelajarku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kb-shared.js"></script>
<style>
:root{
  --paper:#F2F4F7;--surface:#fff;--ink:#1B2333;--ink2:#4A566B;--ink3:#74809A;--line:#E1E6EE;
  --brand:#2E5A99;--brand-soft:#E4ECF8;--danger:#B3372B;--ok:#1B7B6A;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --tab-h:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #7FA6DE;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.u{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.u.fill{fill:currentColor}
.i3{display:block;flex:none}

/* ---------- kerangka ---------- */
.shell{min-height:100vh;display:block}
.rail{display:none}
.main{min-width:0;padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
.inner{width:100%;max-width:760px;margin:0 auto;padding:0 16px}

.bar{position:sticky;top:0;z-index:20;background:rgba(242,244,247,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
.bar .inner{display:flex;align-items:center;gap:10px;height:60px}
.bar-t{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink);position:relative}
.ibtn:hover{background:#E6EAF1}
.ibtn.solid{background:var(--surface);border:1px solid var(--line)}
.ibtn[aria-pressed=true]{color:var(--brand)}
.brandmark{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:#F9E3B3;color:#6B4400;font-weight:700;font-size:14px;display:grid;place-items:center}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:48px;width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(27,35,51,.14);z-index:40}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block;font-size:15px}
.menu .who span{font-size:13px;color:var(--ink3)}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:transparent;border-radius:9px;font-size:15px;text-align:left}
.menu a:hover,.menu button:hover{background:var(--paper)}

/* ---------- pencarian & semester ---------- */
.tools{padding:4px 0 6px}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink3)}
.search:focus-within{border-color:#7FA6DE;box-shadow:0 0 0 3px #DCE8F8}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search input::-webkit-search-cancel-button{display:none}
.seg{display:flex;gap:6px;margin:12px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:38px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:#FFF4D8;color:#6B4A00;font-size:14px;line-height:1.45}

/* ---------- judul bagian ---------- */
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sech h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.sech span{font-size:14px;color:var(--ink3)}

/* ---------- rak: sampul buku ---------- */
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;align-items:end}
.cover{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:158px;padding:86px 14px 14px 24px;border-radius:5px 18px 18px 5px;background:var(--bg);color:var(--deep);overflow:hidden;isolation:isolate;box-shadow:0 1px 0 rgba(27,35,51,.06),0 8px 14px -10px rgba(27,35,51,.35);transition:transform .15s ease}
.cover:hover{transform:translateY(-3px)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:11px;background:var(--deep);z-index:-1}
.cover::after{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55);z-index:-1}
.cover:nth-child(4n+2){min-height:176px}
.cover:nth-child(4n+3){min-height:166px}
.cover:nth-child(4n+4){min-height:150px}
.cover .i3{position:absolute;right:6px;top:10px;width:72px;height:72px}
.cover b{display:block;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.12;color:var(--ink);letter-spacing:-.005em;overflow-wrap:anywhere;max-width:100%}
.cover small{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--deep)}
.cover.compact{min-height:0;padding:10px 12px 10px 22px;flex-direction:row;align-items:center;gap:10px}
.cover.compact .i3{position:static;width:38px;height:38px}
.cover.compact b{font-size:16px}
.cover.compact small{margin:2px 0 0}

/* ---------- lanjutkan ---------- */
.resume{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 22px;border-radius:5px 16px 16px 5px;background:var(--bg);position:relative;overflow:hidden;margin-top:16px}
.resume::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--deep)}
.resume .i3{width:52px;height:52px}
.resume div{flex:1;min-width:0}
.resume small{display:block;font-size:13px;font-weight:600;color:var(--deep)}
.resume b{display:block;font-family:var(--display);font-size:17px;line-height:1.2;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .u{color:var(--deep)}

/* ---------- daftar materi ---------- */
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mrow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mark{width:5px;background:var(--deep,var(--brand));flex:none}
.mlink{flex:1;min-width:0;display:block;padding:14px 4px 14px 14px}
.mlink:hover{background:#FAFBFD}
.mlink h3{margin:0;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.005em}
.mlink p{margin:4px 0 0;font-size:14px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mlink mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 1px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--ink3)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .u{width:15px;height:15px;stroke-width:2.2}
.meta .sub{color:var(--deep);font-weight:600}
.rowsave{width:52px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink3);flex:none}
.rowsave:hover{color:var(--brand)}
.rowsave[aria-pressed=true]{color:var(--brand)}

/* ---------- kepala mata pelajaran & materi ---------- */
.band{position:relative;overflow:hidden;border-radius:5px 22px 22px 5px;background:var(--bg);padding:20px 20px 20px 30px;margin-top:6px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:13px;background:var(--deep);z-index:-1}
.band::after{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55);z-index:-1}
.band .i3{position:absolute;right:14px;top:14px;width:96px;height:96px}
.band h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.08;letter-spacing:-.015em;max-width:calc(100% - 100px);overflow-wrap:anywhere}
.band p{margin:8px 0 0;font-size:15px;color:var(--ink2);max-width:calc(100% - 104px)}
.band .count{margin-top:12px;font-size:14px;font-weight:600;color:var(--deep)}

.article{padding-top:6px}
.article h2.title{margin:18px 0 0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.018em}
.article .meta{margin-top:12px;font-size:14px}
.lead{margin:16px 0 0;font-size:18px;line-height:1.55;color:var(--ink2)}
.prose{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;font-size:17px;line-height:1.75;color:#243049}
.prose p{margin:0 0 1.05em;max-width:66ch}
.prose h3{font-family:var(--display);font-size:21px;line-height:1.2;margin:1.5em 0 .5em;letter-spacing:-.01em}
.prose ul,.prose ol{margin:0 0 1.05em;padding-left:1.35em;max-width:66ch}
.prose li{margin:.3em 0}
.prose>*:last-child{margin-bottom:0}
.prose>h3:first-child{margin-top:0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pn a{display:block;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pn a small{display:flex;align-items:center;gap:4px;color:var(--ink3);font-size:13px;font-weight:600}
.pn a b{display:block;margin-top:4px;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pn a.next{text-align:right}
.pn a.next small{justify-content:flex-end}
.pn .none{visibility:hidden}

/* ---------- kosong / galat / skeleton ---------- */
.empty{padding:30px 20px;text-align:center;color:var(--ink2);background:var(--surface);border:1px dashed #C9D2E0;border-radius:18px}
.empty .i3{margin:0 auto 10px;width:64px;height:64px}
.empty b{display:block;font-family:var(--display);font-size:19px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 auto;max-width:40ch;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;margin-top:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.errbox{padding:16px;border-radius:14px;background:#FDECEA;color:#7E2118;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.skel{border-radius:16px;background:linear-gradient(90deg,#E9EDF3 0%,#F4F6FA 50%,#E9EDF3 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- navigasi bawah & toast ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding:0 8px env(safe-area-inset-bottom,0px);display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink3);position:relative}
.tabs a[aria-current=page]{color:var(--brand)}
.tabs a[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:50;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:#9DC1F5;font-weight:700;padding:0}

@media (min-width:640px){
  .shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px}
  .inner{padding:0 24px}
  .seg{margin-left:-24px;margin-right:-24px;padding:0 24px 2px}
}

/* ---------- desktop ---------- */
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:272px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:#F8F9FB;overflow-y:auto}
  .rail .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;padding:0 8px 20px}
  .rail nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:15px;color:var(--ink2)}
  .rail nav a:hover{background:#ECEFF4}
  .rail nav a[aria-current=page]{background:var(--ink);color:#fff}
  .rail nav a .n{margin-left:auto;font-size:13px;opacity:.75}
  .rail h4{margin:22px 12px 8px;font-size:13px;font-weight:700;color:var(--ink3)}
  .rail .subs a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink)}
  .rail .subs a:hover{background:#ECEFF4}
  .rail .subs a[aria-current=page]{background:var(--bg,#E4ECF8);font-weight:700}
  .rail .subs a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail .subs a em{font-style:normal;font-size:13px;color:var(--ink3)}
  .tabs{display:none}
  .main{padding-bottom:64px}
  .inner{max-width:980px;padding:0 40px}
  .seg{margin-left:0;margin-right:0;padding:0}
  .bar .inner{height:72px}
  .shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 20px}
  .cover{min-height:178px}
  .cover:nth-child(4n+2){min-height:198px}
  .cover:nth-child(4n+3){min-height:186px}
  .cover:nth-child(4n+4){min-height:170px}
  .cover{padding-top:94px}
  .cover .i3{width:80px;height:80px}
  .cover b{font-size:20px}
  .toast{bottom:28px;left:calc(50% + 136px)}
  .article{max-width:760px}
  .prose{padding:32px 36px}
  .bar .brandmark{display:none}
}
@media (min-width:1280px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.cover,.toast{transition:none}.skel{animation:none}}

/* --- Visual pelajaran: katalog belajar yang rapi, konten tetap dari database --- */
:root{--paper:#f2f5ff;--surface:#fff;--ink:#172f68;--ink2:#53668f;--ink3:#7a88a8;--line:#e2e9fa;--brand:#1764df;--brand-soft:#e6eeff}
body{background:var(--paper)}
.bar{background:rgba(242,245,255,.94);border-bottom:1px solid #e8edfa}
.brandmark{background:linear-gradient(145deg,#1764df,#3985f3);border-radius:12px;box-shadow:0 5px 12px #1764df30}
.bar-t{color:#17356f}
.search{border-radius:28px;border:1px solid #e2e9fa;box-shadow:0 5px 15px #203d7c0a}
.seg{gap:8px;margin-top:14px}
.seg button{height:42px;border-radius:24px;background:#fff;border-color:#e2e9fa;padding:0 16px}
.seg button[aria-pressed=true]{background:#1764df;border-color:#1764df;box-shadow:0 5px 12px #1764df30}
.sech{margin:25px 0 13px}
.sech h2{color:#18366f;font-size:21px}
.shelf{gap:13px}
.cover,.cover:nth-child(n){min-height:142px;padding:76px 14px 14px 18px;border-radius:20px;background:linear-gradient(145deg,var(--bg),#fff);border:1px solid #e7ecfa;box-shadow:0 7px 16px #213b7410}
.cover:before,.cover:after{display:none}
.cover .i3{right:12px;top:8px;width:68px;height:68px;filter:drop-shadow(0 5px 5px #1d3b7620)}
.cover b{color:#18366f;font-size:17px}
.cover small{color:var(--deep)}
.resume{border-radius:20px;background:linear-gradient(110deg,#e5edff,#fff);border:1px solid #dfe8ff;box-shadow:0 6px 16px #1d3b7610;padding:14px 16px}
.resume:before{display:none}
.resume .i3{width:54px;height:54px}
.band{border-radius:22px;background:linear-gradient(120deg,var(--bg),#fff);border:1px solid #e3eafb;box-shadow:0 8px 20px #213b7410;padding:20px 18px;min-height:160px}
.band:before,.band:after{display:none}
.band .i3{width:100px;height:100px;right:13px;top:13px;filter:drop-shadow(0 7px 7px #203c7720)}
.band h2{color:#18366f;font-size:28px}
.band p{color:#53668f}
.band .count{color:var(--deep)}
.mlist{border-radius:18px;border-color:#e5ebfa;box-shadow:0 5px 15px #213b7409}
.mrow{border-color:#edf0f8}
.mrow .mark{width:4px}
.mlink{padding:16px 6px 16px 14px}
.mlink h3{color:#19366f;font-size:17px}
.mlink p{color:#657493}
.rowsave{width:48px}
.article .band{box-shadow:none}
.prose{border-radius:18px;border-color:#e5ebfa;box-shadow:0 5px 15px #213b7408}
.btn{border-radius:14px}
.btn.primary{background:#1764df;border-color:#1764df;box-shadow:0 5px 12px #1764df22}
.tab{background:#fff;border-top:1px solid #e3eafb;box-shadow:0 -6px 20px #233e7910}
@media(min-width:760px){
 body{background:#edf2ff}
 .main{background:#f6f8ff}
 .inner{max-width:820px}
 .shelf{grid-template-columns:repeat(3,minmax(0,1fr))}
 .cover,.cover:nth-child(n){min-height:155px}
}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

<!-- ikon antarmuka (garis) -->
<symbol id="u-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="u-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
<symbol id="u-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
<symbol id="u-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
<symbol id="u-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
<symbol id="u-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
<symbol id="u-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
<symbol id="u-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
<symbol id="u-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="u-prev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="u-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
<symbol id="u-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>

</svg>

<div class="shell">

<script>
/* Konfigurasi sama dengan index.html dan dashboard (tidak ada konfigurasi baru). */
const SUPABASE_URL='https://zqjsvihbqmmpnrhuvtyc.supabase.co';
const SUPABASE_KEY='sb_publishable_7GAjjaWrZBLFjEPuiKCd4A_2dKWgnlM';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const U=(id,cls='')=>`<svg class="u ${cls}" aria-hidden="true"><use href="#u-${id}"/></svg>`;

/* ---------- tema mata pelajaran (ikon dari kb-shared.js) ---------- */
const THEMES=KB.THEMES;
const themeCache=new Map();
function themeOf(subject){
 const key=subject?String(subject.id):'-';
 if(themeCache.has(key))return themeCache.get(key);
 const a=KB.auto(subject),o=KB.cfg.style[key]||{},tk=THEMES[o.theme]?o.theme:a.theme;
 const th={icon:KB.ICONS[o.icon]?o.icon:a.icon,key:tk,bg:THEMES[tk].bg,deep:THEMES[tk].deep};
 themeCache.set(key,th);return th;
}
const themeStyle=t=>`--bg:${t.bg};--deep:${t.deep}`;
const I3=(icon,size)=>`<svg class="i3" ${size?`width="${size}" height="${size}"`:''} viewBox="0 0 64 64" aria-hidden="true"><use href="#i-${icon}"/></svg>`;

/* ---------- keadaan ---------- */
const S={done:new Set(),features:[],att:[],user:null,profile:null,subjects:[],materials:[],loaded:false,error:'',query:'',sem:'all',saved:[],route:{name:'home'},listHash:'',listQuery:''};
const isAdmin=()=>S.profile?.role==='admin';
const subjectById=id=>S.subjects.find(s=>String(s.id)===String(id));
const materialById=id=>S.materials.find(m=>String(m.id)===String(id));

/* ---------- penyimpanan materi (per akun, di perangkat ini) ---------- */
const store={
 key(){return `kb:saved:${S.user.id}`;},
 lastKey(){return `kb:last:${S.user.id}`;},
 load(){try{const v=JSON.parse(localStorage.getItem(this.key())||'[]');return Array.isArray(v)?v.filter(x=>x&&x.id!=null).map(x=>({id:String(x.id),at:Number(x.at)||0})):[];}catch(e){return [];}},
 save(){try{localStorage.setItem(this.key(),JSON.stringify(S.saved));return true;}catch(e){return false;}},
 getLast(){try{return localStorage.getItem(this.lastKey());}catch(e){return null;}},
 setLast(id){try{localStorage.setItem(this.lastKey(),String(id));}catch(e){}}
};
const isSaved=id=>S.saved.some(x=>x.id===String(id));
function toggleSaved(id){
 id=String(id);
 let nowSaved;
 if(isSaved(id)){S.saved=S.saved.filter(x=>x.id!==id);nowSaved=false;}
 else{S.saved.unshift({id,at:Date.now()});nowSaved=true;}
 const ok=store.save();
 return {nowSaved,ok};
}

/* ---------- semester ---------- */
function parseSem(v){
 const t=norm(v).trim();
 if(!t)return null;
 if(/ganjil/.test(t))return 1;
 if(/genap/.test(t))return 2;
 const m=t.match(/^(?:semester|smt|sem)?\.?\s*(1|2|i|ii)$/);
 if(m)return (m[1]==='1'||m[1]==='i')?1:2;
 return null;
}
function detectSemester(m){
 /* 1) kolom semester jika suatu saat ditambahkan di database; 2) teks pada judul/deskripsi */
 for(const src of [m,subjectById(m.subject_id)]){
  if(src&&src.semester!=null&&src.semester!==''){const n=parseSem(src.semester);if(n)return n;}
 }
 const text=`${m.title||''} ${m.description||''}`;
 let x=text.match(/\b(?:semester|smt|sem)\.?\s*([12])\b/i);
 if(x)return Number(x[1]);
 x=text.match(/\b(?:semester|smt|sem)\.?\s*(ganjil|genap)\b/i)||text.match(/\b(ganjil|genap)\b/i);
 if(x)return norm(x[1])==='ganjil'?1:2;
 return null;
}
const semOk=m=>S.sem==='all'||(S.sem==='none'?!m._sem:m._sem===Number(S.sem));

/* ---------- pencarian ---------- */
const tokens=()=>norm(S.query).split(/\s+/).filter(Boolean);
function score(m,toks){
 if(!toks.length)return 1;
 let total=0;
 for(const k of toks){
  let sc=0;
  if(m._t.includes(k))sc=6;else if(m._s.includes(k))sc=4;else if(m._d.includes(k))sc=3;else if(m._c.includes(k))sc=1;
  if(!sc)return 0;
  total+=sc;
 }
 return total;
}
function hl(text,toks){
 text=String(text??'');
 if(!toks.length)return esc(text);
 const re=new RegExp('('+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
 return text.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');
}
function snippet(m,toks){
 const desc=(m.description||'').trim();
 if(!toks.length)return desc||firstLine(m.content);
 if(toks.some(t=>m._d.includes(t)))return desc;
 const c=String(m.content||'').replace(/\s+/g,' ');
 const nc=norm(c);
 const idx=Math.min(...toks.map(t=>{const i=nc.indexOf(t);return i<0?1e9:i;}));
 if(idx<1e9){const s=Math.max(0,idx-40);return (s>0?'…':'')+c.slice(s,s+150)+(s+150<c.length?'…':'');}
 return desc||firstLine(m.content);
}
function firstLine(t){return String(t||'').replace(/\s+/g,' ').trim().slice(0,120);}
const readMins=m=>Math.max(1,Math.ceil(String(m.content||'').trim().split(/\s+/).filter(Boolean).length/180));
const fmtDate=d=>{try{return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}catch(e){return '';}};
const semLabel=n=>`Semester ${n}`;

/* ---------- format isi materi (teks biasa -> HTML aman) ---------- */
function formatContent(raw){
 const lines=String(raw||'').replace(/\r\n?/g,'\n').split('\n');
 let html='',para=[],list=null;
 const flushPara=()=>{if(para.length){html+=`<p>${para.map(esc).join('<br>')}</p>`;para=[];}};
 const flushList=()=>{if(list){html+=`<${list.tag}>${list.items.map(i=>`<li>${esc(i)}</li>`).join('')}</${list.tag}>`;list=null;}};
 for(const line of lines){
  const t=line.trim();
  if(!t){flushPara();flushList();continue;}
  let m;
  if((m=t.match(/^[-*•]\s+(.*)$/))){flushPara();if(!list||list.tag!=='ul'){flushList();list={tag:'ul',items:[]};}list.items.push(m[1]);continue;}
  if((m=t.match(/^\d+[.)]\s+(.*)$/))){flushPara();if(!list||list.tag!=='ol'){flushList();list={tag:'ol',items:[]};}list.items.push(m[1]);continue;}
  if((m=t.match(/^#{1,3}\s+(.*)$/))){flushPara();flushList();html+=`<h3>${esc(m[1])}</h3>`;continue;}
  flushList();para.push(t);
 }
 flushPara();flushList();
 return html||'<p style="color:var(--ink3)">Materi ini belum memiliki isi.</p>';
}

/* ---------- komponen tampilan ---------- */
const hrefSubject=id=>`#/mapel/${encodeURIComponent(id)}`;
const hrefMaterial=id=>`#/materi/${encodeURIComponent(id)}`;
function countFor(subjectId){return S.materials.filter(m=>String(m.subject_id)===String(subjectId)&&semOk(m)).length;}
function subjectMaterials(subjectId){
 return S.materials.filter(m=>String(m.subject_id)===String(subjectId)).sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||''))||String(a.title).localeCompare(String(b.title),'id'));
}
function coverHTML(s,{compact=false}={}){
 const t=themeOf(s),n=countFor(s.id);
 const label=n?`${n} materi`:(S.sem==='all'?'Belum ada materi':'Tidak ada materi');
 return `<a class="cover${compact?' compact':''}" href="${hrefSubject(s.id)}" style="${themeStyle(t)}">${I3(t.icon)}<span><b>${esc(s.name)}</b><small>${label}</small></span></a>`;
}
function rowHTML(m,{toks=[],showSubject=true}={}){
 const s=subjectById(m.subject_id),t=themeOf(s);
 const saved=isSaved(m.id);
 const sn=snippet(m,toks);
 return `<article class="mrow" style="${themeStyle(t)}"><span class="mark"></span>
  <a class="mlink" href="${hrefMaterial(m.id)}"><h3>${hl(m.title,toks)}</h3>${sn?`<p>${hl(sn,toks)}</p>`:''}
   <div class="meta">${showSubject?`<span class="sub">${esc(s?.name||'Mata pelajaran')}</span>`:''}<span>${U('clock')}${readMins(m)} menit baca</span>${m._sem?`<span>${U('cal')}${semLabel(m._sem)}</span>`:''}</div></a>
  <button class="rowsave" type="button" data-save="${esc(m.id)}" aria-pressed="${saved}" aria-label="${saved?'Hapus dari tersimpan':'Simpan materi'}: ${esc(m.title)}">${U('bookmark',saved?'fill':'')}</button></article>`;
}
function emptyHTML({icon='books',title,text,action}){
 return `<div class="empty">${I3(icon)}<b>${esc(title)}</b><p>${esc(text)}</p>${action||''}</div>`;
}
function skeleton(){
 return `<div class="sech"><h2>Mata pelajaran</h2></div><div class="shelf">${[158,176,166,150,158,176].map(h=>`<div class="skel" style="height:${h}px"></div>`).join('')}</div>`;
}

/* ---------- tampilan: beranda ---------- */
function viewHome(){
 const toks=tokens();
 if(toks.length)return viewSearch(toks);
 let html='';
 const last=store.getLast(),lm=last&&materialById(last);
 if(lm){
  const s=subjectById(lm.subject_id),t=themeOf(s);
  html+=`<a class="resume" href="${hrefMaterial(lm.id)}" style="${themeStyle(t)}">${I3(t.icon)}<div><small>Lanjutkan membaca</small><b>${esc(lm.title)}</b></div>${U('next')}</a>`;
 }
 html+=featShelf();
 const subs=S.subjects.filter(s=>S.sem==='all'||countFor(s.id)>0);
 html+=`<div class="sech"><h2>Mata pelajaran</h2><span>${subs.length} mata pelajaran</span></div>`;
 if(!S.subjects.length){
  html+=emptyHTML({title:'Belum ada mata pelajaran',text:isAdmin()?'Tambahkan mata pelajaran dan materi dari dashboard admin agar siswa bisa mulai belajar.':'Mata pelajaran akan muncul di sini setelah guru atau admin menambahkannya.',action:isAdmin()?'<a class="btn primary" href="/kawanbelajarku-dashboard.html">Buka dashboard</a>':''});
 }else if(!subs.length){
  html+=emptyHTML({title:`Belum ada materi untuk ${semFilterName()}`,text:'Coba pilih semester lain atau tampilkan semua materi.',action:'<button class="btn primary" type="button" data-sem="all">Tampilkan semua</button>'});
 }else{
  html+=`<div class="shelf">${subs.map(s=>coverHTML(s)).join('')}</div>`;
 }
 return html;
}
const semFilterName=()=>S.sem==='none'?'materi tanpa semester':semLabel(S.sem);

function viewSearch(toks){
 const subs=S.subjects.filter(s=>toks.every(k=>norm(s.name).includes(k)||norm(s.description).includes(k)));
 const mats=S.materials.filter(semOk).map(m=>({m,sc:score(m,toks)})).filter(x=>x.sc>0)
  .sort((a,b)=>b.sc-a.sc||String(b.m.created_at||'').localeCompare(String(a.m.created_at||''))).map(x=>x.m);
 if(!subs.length&&!mats.length){
  return emptyHTML({icon:'books',title:'Tidak ada hasil',text:`Tidak ada mata pelajaran atau materi yang cocok dengan “${S.query.trim()}”${S.sem!=='all'?` pada ${semFilterName()}`:''}. Coba kata kunci lain.`,action:`<button class="btn" type="button" data-clear>Hapus pencarian</button>`});
 }
 let html='';
 if(subs.length)html+=`<div class="sech"><h2>Mata pelajaran</h2><span>${subs.length} cocok</span></div><div class="shelf">${subs.map(s=>coverHTML(s,{compact:false})).join('')}</div>`;
 if(mats.length)html+=`<div class="sech"><h2>Materi</h2><span>${mats.length} cocok</span></div><div class="mlist">${mats.map(m=>rowHTML(m,{toks})).join('')}</div>`;
 return html;
}

/* ---------- tampilan: mata pelajaran ---------- */
function viewSubject(id){
 const s=subjectById(id);
 if(!s)return emptyHTML({title:'Mata pelajaran tidak ditemukan',text:'Mata pelajaran ini mungkin sudah dihapus.',action:'<a class="btn primary" href="#/">Kembali ke Pelajaran</a>'});
 const t=themeOf(s),all=subjectMaterials(s.id),toks=tokens();
 const list=all.filter(semOk).map(m=>({m,sc:score(m,toks)})).filter(x=>x.sc>0).map(x=>x.m);
 const filtered=S.sem!=='all'||toks.length;
 let html=`<div class="band" style="${themeStyle(t)}">${I3(t.icon)}<h2>${esc(s.name)}</h2>${s.description?`<p>${esc(s.description)}</p>`:''}<div class="count">${filtered?`${list.length} dari ${all.length} materi`:`${all.length} materi`}</div></div>`;
 html+=`<div class="sech"><h2>Materi</h2></div>`;
 if(!all.length)html+=emptyHTML({icon:'books',title:'Belum ada materi',text:'Materi untuk mata pelajaran ini belum ditambahkan.'});
 else if(!list.length)html+=emptyHTML({icon:'books',title:'Tidak ada materi yang cocok',text:toks.length?`Tidak ada hasil untuk “${S.query.trim()}”${S.sem!=='all'?` pada ${semFilterName()}`:''}.`:`Belum ada materi untuk ${semFilterName()}.`,action:`<button class="btn primary" type="button" data-reset>Reset filter</button>`});
 else html+=`<div class="mlist" style="${themeStyle(t)}">${list.map(m=>rowHTML(m,{toks,showSubject:false})).join('')}</div>`;
 return html;
}

/* ---------- tampilan: detail materi ---------- */
function viewMaterial(id){
 const m=materialById(id);
 if(!m)return emptyHTML({title:'Materi tidak ditemukan',text:'Materi ini mungkin sudah dihapus atau tautannya keliru.',action:'<a class="btn primary" href="#/">Kembali ke Pelajaran</a>'});
 const s=subjectById(m.subject_id),t=themeOf(s),siblings=subjectMaterials(m.subject_id);
 const i=siblings.findIndex(x=>String(x.id)===String(m.id));
 const prev=i>0?siblings[i-1]:null,next=i>=0&&i<siblings.length-1?siblings[i+1]:null;
 const saved=isSaved(m.id);
 return `<article class="article" style="${themeStyle(t)}">
  <div class="band" style="min-height:112px;padding-top:16px;padding-bottom:16px">${I3(t.icon)}<a href="${hrefSubject(m.subject_id)}" style="font-weight:700;color:var(--deep);font-size:15px;max-width:calc(100% - 100px)">${esc(s?.name||'Mata pelajaran')}</a></div>
  <h2 class="title">${esc(m.title)}</h2>
  <div class="meta"><span>${U('clock')}${readMins(m)} menit baca</span>${m._sem?`<span>${U('cal')}${semLabel(m._sem)}</span>`:''}${m.created_at?`<span>Ditambahkan ${esc(fmtDate(m.created_at))}</span>`:''}</div>
  ${m.description?`<p class="lead">${esc(m.description)}</p>`:''}
  <div class="prose">${formatContent(m.content)}</div>
  ${attHTML('material',m.id)}
  <button class="btn ${saved?'':'primary'}" type="button" data-save="${esc(m.id)}" aria-pressed="${saved}" id="detailSave" style="width:100%">${U('bookmark',saved?'fill':'')}<span>${saved?'Tersimpan':'Simpan materi'}</span></button>
  <button class="btn ${S.done.has(String(m.id))?'':'primary'}" type="button" data-done="${esc(m.id)}" style="width:100%">${S.done.has(String(m.id))?'Selesai ✓ (ketuk untuk batalkan)':'Tandai selesai'}</button>
  <div class="pn">${prev?`<a href="${hrefMaterial(prev.id)}"><small>${U('prev')}Sebelumnya</small><b>${esc(prev.title)}</b></a>`:'<span class="none"></span>'}${next?`<a class="next" href="${hrefMaterial(next.id)}"><small>Berikutnya${U('next')}</small><b>${esc(next.title)}</b></a>`:'<span class="none"></span>'}</div>
 </article>`;
}

/* ---------- tampilan: tersimpan ---------- */
function viewSaved(){
 const toks=tokens();
 const items=S.saved.map(x=>materialById(x.id)).filter(Boolean).map(m=>({m,sc:score(m,toks)})).filter(x=>x.sc>0).map(x=>x.m);
 let html=`<div class="sech"><h2>Materi tersimpan</h2><span>${S.saved.length} materi</span></div>`;
 if(!S.saved.length)return html+emptyHTML({icon:'bookmark',title:'Belum ada materi tersimpan',text:'Ketuk ikon bookmark pada materi untuk menyimpannya. Materi tersimpan muncul di sini dan hanya ada di perangkat ini.',action:'<a class="btn primary" href="#/">Jelajahi pelajaran</a>'});
 if(!items.length)return html+emptyHTML({icon:'books',title:'Tidak ada hasil',text:`Tidak ada materi tersimpan yang cocok dengan “${S.query.trim()}”.`,action:'<button class="btn" type="button" data-clear>Hapus pencarian</button>'});
 html+=`<div class="mlist">${items.map(m=>rowHTML(m,{toks})).join('')}</div>`;
 html+=`<p style="margin:14px 2px 0;font-size:13px;color:var(--ink3)">Materi tersimpan disimpan di browser perangkat ini untuk akun kamu.</p>`;
 return html;
}

const featById=id=>S.features.find(f=>String(f.id)===String(id));
const featTheme=f=>{const t=THEMES[f.theme]||THEMES.sky;return {icon:KB.ICONS[f.icon]?f.icon:'star',bg:t.bg,deep:t.deep};};
function attHTML(type,id){const a=S.att.filter(x=>x.owner_type===type&&String(x.owner_id)===String(id));return a.length?`<div class="sech"><h2>Lampiran</h2><span>${a.length}</span></div>${a.map(x=>KB.attView(x)).join('')}`:'';}
function featShelf(){if(!S.features.length)return '';return `<div class="sech"><h2>Fitur</h2><span>${S.features.length} fitur</span></div><div class="shelf">${S.features.map(f=>{const t=featTheme(f);return `<a class="cover" href="#/fitur/${encodeURIComponent(f.id)}" style="${themeStyle(t)}">${I3(t.icon)}<span><b>${esc(f.title)}</b><small>${esc(f.description||'Buka fitur')}</small></span></a>`;}).join('')}</div>`;}
function viewFeature(id){const f=featById(id);if(!f)return emptyHTML({title:'Fitur tidak ditemukan',text:'Fitur ini mungkin sudah dihapus.',action:'<a class="btn primary" href="#/">Kembali</a>'});const t=featTheme(f);return `<article class="article" style="${themeStyle(t)}"><div class="band">${I3(t.icon)}<h2>${esc(f.title)}</h2>${f.description?`<p>${esc(f.description)}</p>`:''}</div>${f.content?`<div class="prose">${formatContent(f.content)}</div>`:''}${attHTML('feature',f.id)}</article>`;}

async function toggleDone(id){const on=!S.done.has(String(id));try{const ex=await db.from('progress').select('id').eq('student_id',S.user.id).eq('material_id',id).maybeSingle();const row={completed:on,updated_at:new Date().toISOString()};const r=ex.data?await db.from('progress').update(row).eq('id',ex.data.id):await db.from('progress').insert({student_id:S.user.id,material_id:id,...row});if(r.error)throw r.error;on?S.done.add(String(id)):S.done.delete(String(id));toast(on?'Ditandai selesai':'Tanda selesai dibatalkan');renderView();}catch(e){toast('Gagal menyimpan progres: '+(e.message||e));}}
/* ---------- bar, alat, rail, tab ---------- */
function renderBar(){
 const r=S.route,L=$('barL'),T=$('barT'),R=$('barR');
 let title='Pelajaran',left='mark';
 if(r.name==='subject'){const s=subjectById(r.id);title=s?s.name:'Mata pelajaran';left='back';}
 else if(r.name==='feature'){const f=featById(r.id);title=f?f.title:'Fitur';left='back';}
 else if(r.name==='material'){title='Materi';left='back';}
 else if(r.name==='saved'){title='Tersimpan';left='back0';}
 L.innerHTML=left==='mark'?`<span class="brandmark"><svg class="u" aria-hidden="true"><use href="#u-book"/></svg></span>`:`<button class="ibtn solid" type="button" id="backBtn" aria-label="Kembali">${U('back')}</button>`;
 T.textContent=title;
 let right='';
 if(r.name==='material'){const m=materialById(r.id);if(m){const sv=isSaved(m.id);right=`<button class="ibtn solid" type="button" data-save="${esc(m.id)}" aria-pressed="${sv}" aria-label="${sv?'Hapus dari tersimpan':'Simpan materi'}">${U('bookmark',sv?'fill':'')}</button>`;}}
 R.innerHTML=right;
 document.title=(r.name==='home'?'Pelajaran':title)+' — KawanBelajarku';
}
function renderChips(){
 const r=S.route,showTools=r.name!=='material'&&r.name!=='feature';
 $('tools').hidden=!showTools;
 if(!showTools)return;
 const showSem=r.name==='home'||r.name==='subject';
 $('seg').hidden=!showSem;
 const tagged=S.materials.filter(m=>m._sem).length,untagged=S.materials.length-tagged;
 const opts=[['all','Semua'],['1','Semester 1'],['2','Semester 2']];
 if(tagged>0&&untagged>0)opts.push(['none','Belum ditandai']);
 $('seg').innerHTML=opts.map(([v,l])=>`<button type="button" data-sem="${v}" aria-pressed="${S.sem===v}">${l}</button>`).join('');
 const hint=$('semHint');
 const need=showSem&&isAdmin()&&S.loaded&&S.materials.length>0&&tagged===0;
 hint.hidden=!need;
 if(need)hint.textContent='Belum ada materi yang bertanda semester, jadi filter ini belum bisa memisahkan materi. Tulis “Semester 1” atau “Semester 2” pada judul atau deskripsi materi di dashboard.';
 const q=$('q');
 q.placeholder=r.name==='subject'?`Cari materi di ${subjectById(r.id)?.name||'mata pelajaran ini'}`:r.name==='saved'?'Cari di materi tersimpan':'Cari mata pelajaran atau materi';
 if(q.value!==S.query)q.value=S.query;
 $('qClear').hidden=!S.query;
}
function renderRail(){
 const r=S.route,n=S.saved.length;
 const cur=(name)=>((name==='pel'&&r.name!=='saved')||(name==='sav'&&r.name==='saved'))?' aria-current="page"':'';
 $('railNav').innerHTML=`<a href="/kawanbelajarku-dashboard.html">${U('home')}Beranda</a><a href="#/"${cur('pel')}>${U('book')}Pelajaran</a><a href="#/tersimpan"${cur('sav')}>${U('bookmark')}Tersimpan<span class="n">${n||''}</span></a>`;
 $('railSubs').innerHTML=S.subjects.map(s=>{const t=themeOf(s);const act=r.name==='subject'&&String(r.id)===String(s.id)?' aria-current="page"':'';return `<a href="${hrefSubject(s.id)}" style="${themeStyle(t)}"${act}>${I3(t.icon,26)}<span>${esc(s.name)}</span><em>${countFor(s.id)}</em></a>`;}).join('')||'<div style="padding:8px 12px;font-size:14px;color:var(--ink3)">Belum ada mata pelajaran</div>';
}
function renderTabs(){
 const r=S.route,n=S.saved.length;
 $('tabs').innerHTML=`<a href="/kawanbelajarku-dashboard.html">${U('home')}Beranda</a><a href="#/"${r.name!=='saved'?' aria-current="page"':''}>${U('book')}Pelajaran</a><a href="#/tersimpan"${r.name==='saved'?' aria-current="page"':''}>${U('bookmark')}Tersimpan${n?`<span class="badge" aria-label="${n} materi">${n}</span>`:''}</a>`;
}
function renderView(){
 const v=$('view');
 if(!S.loaded){v.innerHTML=skeleton();return;}
 if(S.error&&!S.subjects.length&&!S.materials.length){v.innerHTML=`<div class="errbox">${esc(S.error)}</div><button class="btn primary" type="button" id="retry">Coba lagi</button>`;return;}
 const r=S.route;
 v.innerHTML=r.name==='feature'?viewFeature(r.id):r.name==='subject'?viewSubject(r.id):r.name==='material'?viewMaterial(r.id):r.name==='saved'?viewSaved():viewHome();
 if(S.error)v.insertAdjacentHTML('afterbegin',`<div class="errbox" style="margin-bottom:12px">${esc(S.error)}</div>`);
}
function renderAll(){renderBar();renderChips();renderRail();renderTabs();renderView();}

/* ---------- routing ---------- */
function parseHash(){
 const h=location.hash.replace(/^#/,'');
 const m=h.match(/^\/(mapel|materi|fitur)\/(.+)$/);
 if(m){let id=m[2];try{id=decodeURIComponent(id);}catch(e){}return {name:{mapel:'subject',materi:'material',fitur:'feature'}[m[1]],id};}
 if(h==='/tersimpan')return {name:'saved'};
 return {name:'home'};
}
const scrollMemo={};
function onRoute(oldHash){
 if(oldHash!==undefined)scrollMemo[oldHash||'#/']=window.scrollY;
 const old=S.route,next=parseHash(),here=location.hash||'#/';
 if(next.name==='material'){
  /* Ingat daftar asal (beranda, mapel, atau tersimpan) agar tombol kembali dan pencarian kembali ke sana. */
  if(old.name!=='material'&&oldHash!==undefined){S.listHash=oldHash||'#/';S.listQuery=S.query;}
 }
 else if(old.name==='material'&&S.listHash===here){S.query=S.listQuery;}
 else if(old.name!==next.name||String(old.id)!==String(next.id)){S.query='';}
 S.route=next;
 if(next.name==='material'){const m=materialById(next.id);if(m)store.setLast(m.id);}
 renderAll();
 window.scrollTo(0,scrollMemo[here]||0);
}
function goBack(){
 const r=S.route;
 if(r.name==='material'){
  const m=materialById(r.id);
  if(S.listHash&&!S.listHash.startsWith('#/materi/')){location.hash=S.listHash;return;}
  location.hash=m?hrefSubject(m.subject_id):'#/';
  return;
 }
 location.hash='#/';
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,action){
 $('toastMsg').textContent=msg;
 const b=$('toastAct');
 if(action){b.hidden=false;b.textContent=action.label;b.onclick=()=>{action.fn();hideToast();};}else{b.hidden=true;b.onclick=null;}
 $('toast').classList.add('on');
 clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,action?5000:2600);
}
function hideToast(){$('toast').classList.remove('on');}

/* ---------- aksi simpan ---------- */
function applySave(id){
 const {nowSaved,ok}=toggleSaved(id);
 document.querySelectorAll('[data-save]').forEach(b=>{
  if(b.dataset.save!==String(id))return;
  b.setAttribute('aria-pressed',String(nowSaved));
  if(b.id==='detailSave'){b.classList.toggle('primary',!nowSaved);b.innerHTML=`${U('bookmark',nowSaved?'fill':'')}<span>${nowSaved?'Tersimpan':'Simpan materi'}</span>`;}
  else{const title=materialById(id)?.title||'';b.setAttribute('aria-label',`${nowSaved?'Hapus dari tersimpan':'Simpan materi'}${title?': '+title:''}`);b.innerHTML=U('bookmark',nowSaved?'fill':'');}
 });
 renderTabs();renderRail();
 if(!ok)toast('Browser tidak mengizinkan penyimpanan. Materi hanya tersimpan sampai halaman ditutup.');
 else if(nowSaved)toast('Materi disimpan');
 else toast('Dihapus dari tersimpan',{label:'Urungkan',fn:()=>{applySave(id);if(S.route.name==='saved')renderView();}});
 if(S.route.name==='saved'&&!nowSaved)renderView();
}

/* ---------- muat data ---------- */
async function loadData(){
 S.error='';
 try{
  const [s,m,fe,at]=await Promise.all([db.from('subjects').select('*'),db.from('materials').select('*'),db.from('features').select('*').order('created_at'),db.from('attachments').select('*').order('created_at')]);
  S.features=fe.data||[];S.att=at.data||[];
  const pg=await db.from('progress').select('material_id,completed').eq('student_id',S.user.id);S.done=new Set((pg.data||[]).filter(x=>x.completed).map(x=>String(x.material_id)));
  const errs=[];
  if(s.error)errs.push('Mata pelajaran: '+s.error.message);
  if(m.error)errs.push('Materi: '+m.error.message);
  if(errs.length)S.error='Gagal memuat data.\n'+errs.join('\n');
  S.subjects=(s.data||[]).slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'id'));
  S.materials=(m.data||[]);
 }catch(e){
  console.error('Muat data gagal:',e);
  S.error='Gagal memuat data: '+(e.message||e);
  S.subjects=[];S.materials=[];
 }
 themeCache.clear();
 for(const m of S.materials){
  m._t=norm(m.title);m._d=norm(m.description);m._c=norm(m.content);
  m._s=norm(subjectById(m.subject_id)?.name);
  m._sem=detectSemester(m);
 }
 /* bersihkan materi tersimpan yang sudah tidak ada */
 if(!S.error){const before=S.saved.length;S.saved=S.saved.filter(x=>materialById(x.id));if(S.saved.length!==before)store.save();}
 S.loaded=true;
}

/* ---------- pengaturan awal ---------- */
function initials(name){const p=String(name||'?').trim().split(/\s+/).filter(Boolean);return ((p[0]?.[0]||'?')+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
async function start(){
 const {data:{session},error:sessionError}=await db.auth.getSession();
 if(sessionError||!session){location.replace('/');return;}
 S.user=session.user;
 const {data:profile,error:profileError}=await db.from('profiles').select('full_name,role').eq('id',S.user.id).maybeSingle();
 const v=$('view');
 if(profileError){v.innerHTML=`<div class="errbox">Gagal membaca profil: ${esc(profileError.message)}</div>`;return;}
 if(!profile){v.innerHTML='<div class="errbox">Profil akun belum ditemukan. Hubungi admin.</div>';return;}
 S.profile=profile;S.saved=store.load();
 await KB.load(db);
 $('menuEditor').hidden=!isAdmin();
 $('avatarBtn').textContent=initials(profile.full_name||S.user.email);
 $('menuName').textContent=profile.full_name||S.user.email||'Pengguna';
 $('menuRole').textContent=isAdmin()?'Admin':'Siswa';
 $('menuDash').textContent=isAdmin()?'Beranda admin':'Beranda';
 S.route=parseHash();renderAll();
 await loadData();
 onRoute();
}
async function logout(){try{await db.auth.signOut();}catch(e){console.error(e);}location.replace('/');}

/* ---------- peristiwa ---------- */
window.addEventListener('hashchange',e=>{let old='';try{old=new URL(e.oldURL).hash;}catch(x){}onRoute(old);});
$('q').addEventListener('input',e=>{S.query=e.target.value;$('qClear').hidden=!S.query;renderView();});
$('qClear').addEventListener('click',()=>{S.query='';$('q').value='';$('qClear').hidden=true;renderView();$('q').focus();});
document.addEventListener('click',e=>{
 const dn=e.target.closest('[data-done]');if(dn){toggleDone(dn.dataset.done);return;}
 const sv=e.target.closest('[data-save]');if(sv){e.preventDefault();applySave(sv.dataset.save);return;}
 const sem=e.target.closest('[data-sem]');if(sem){S.sem=sem.dataset.sem;renderChips();renderView();renderRail();return;}
 if(e.target.closest('[data-clear]')){S.query='';$('q').value='';renderChips();renderView();return;}
 if(e.target.closest('[data-reset]')){S.query='';S.sem='all';$('q').value='';renderChips();renderView();renderRail();return;}
 if(e.target.closest('#backBtn')){goBack();return;}
 if(e.target.closest('#retry')){S.loaded=false;renderView();loadData().then(()=>renderAll());return;}
 const av=e.target.closest('#avatarBtn');
 if(av){const open=$('menu').hidden;$('menu').hidden=!open;av.setAttribute('aria-expanded',String(open));return;}
 if(!e.target.closest('#menu')){$('menu').hidden=true;$('avatarBtn').setAttribute('aria-expanded','false');}
});
$('logoutBtn').addEventListener('click',logout);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('menu').hidden=true;$('avatarBtn').setAttribute('aria-expanded','false');}});
if(db.auth.onAuthStateChange)db.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.replace('/');});

renderView();
start().catch(e=>{console.error(e);$('view').innerHTML=`<div class="errbox">Terjadi kesalahan: ${esc(e.message||e)}</div>`;});
</script>
</body>
