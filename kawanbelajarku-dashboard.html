<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1458CE">
<title>Beranda — KawanBelajarku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kb-shared.js"></script>
<style>
:root{
  --brand:#1764DF;
  --brand-dark:#0F45A6;
  --ink:#132A63;
  --ink2:#465B87;
  --ink3:#7486AB;
  --line:#E3EAFB;
  --bg:#F2F6FF;
  --surface:#FFFFFF;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.45;
  padding-bottom:96px;
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit}
a{color:inherit;text-decoration:none}

.wrap{max-width:540px;margin:0 auto;padding:0 16px}

/* ---------- HEADER BIRU MODERN ---------- */
.hd{
  background:
    radial-gradient(circle at 90% -15%, rgba(114,178,255,.45) 0 22%, transparent 23%),
    radial-gradient(circle at 8% 12%, rgba(62,139,247,.38) 0 15%, transparent 16%),
    linear-gradient(155deg, #104BB8 0%, #1767E3 55%, #2B7FF0 100%);
  color:#fff;
  padding:calc(16px + env(safe-area-inset-top,0px)) 0 56px;
  position:relative;
  overflow:hidden;
  border-radius:0 0 28px 28px;
}
.hd::after{
  content:"";
  position:absolute;
  right:-65px;
  bottom:-110px;
  width:250px;
  height:250px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:50%;
  box-shadow:0 0 0 26px rgba(255,255,255,.06), 0 0 0 54px rgba(255,255,255,.04);
  pointer-events:none;
}
.top{
  display:flex;
  align-items:center;
  gap:10px;
  position:relative;
  z-index:1;
}
.top-logo{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.28);
  display:grid;
  place-items:center;
  flex:none;
}
.top b{
  flex:1;
  font-size:18px;
  font-weight:800;
  letter-spacing:-.02em;
}
.av{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  border:1.5px solid rgba(255,255,255,.4);
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:14px;
  transition:transform .15s ease, background .15s ease;
}
.av:hover{background:rgba(255,255,255,.3);transform:scale(1.04)}

/* Kartu Profil & Progres Belajar di Header */
.me{
  display:flex;
  align-items:center;
  gap:13px;
  margin-top:20px;
  position:relative;
  z-index:1;
}
.big{
  width:68px;
  height:68px;
  border-radius:50%;
  background:linear-gradient(135deg,#FFF3D6,#FDE0A1);
  color:#8F5408;
  display:grid;
  place-items:center;
  font-size:24px;
  font-weight:800;
  border:3px solid rgba(255,255,255,.75);
  box-shadow:0 8px 20px rgba(9,38,102,.28);
  flex:none;
}
.mi{flex:1;min-width:0}
.mi h1{
  margin:0;
  font-size:20px;
  font-weight:800;
  letter-spacing:-.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#38E09B;
  color:#053B25;
  font-weight:800;
  font-size:11.5px;
  padding:2.5px 10px;
  border-radius:20px;
  margin:4px 0;
}
.st{
  font-size:12.5px;
  color:rgba(255,255,255,.9);
  font-weight:500;
}
.pg{
  flex:none;
  width:136px;
  background:rgba(255,255,255,.17);
  border:1px solid rgba(255,255,255,.32);
  border-radius:18px;
  padding:10px 12px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s ease;
}
.pg:hover{transform:translateY(-2px)}
.pg small{font-size:11.5px;font-weight:600;opacity:.92;display:block}
.pg b{display:block;font-size:25px;font-weight:800;line-height:1.15;margin-top:2px}
.pg i,.mp{
  display:block;
  height:7px;
  background:rgba(255,255,255,.28);
  border-radius:99px;
  overflow:hidden;
  margin-top:7px;
}
.pg u,.mp i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#FFD036,#FFAE00);
  border-radius:99px;
  text-decoration:none;
  transition:width .4s ease;
}
.wl{
  font-size:13px;
  margin-top:12px;
  color:rgba(255,255,255,.92);
  position:relative;
  z-index:1;
}
.wl:empty{display:none}

/* ---------- KOLOM PENCARIAN MENGAMBANG ---------- */
.sr-wrap{
  max-width:540px;
  margin:-27px auto 0;
  padding:0 16px;
  position:relative;
  z-index:3;
}
.sr{
  display:flex;
  gap:10px;
  align-items:center;
  background:#fff;
  border-radius:99px;
  padding:0 18px;
  height:54px;
  border:1px solid #E2E9FA;
  box-shadow:0 10px 26px rgba(19,65,155,.13);
  transition:box-shadow .2s ease, border-color .2s ease;
}
.sr:focus-within{
  border-color:#78A9F8;
  box-shadow:0 12px 30px rgba(23,100,223,.2);
}
.sr input{
  flex:1;
  border:0;
  outline:0;
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  background:transparent;
  min-width:0;
}
.sr input::placeholder{color:#8696B8;font-weight:500}
.sr svg{width:20px;height:20px;stroke:#6E81A8;fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}

/* ---------- PANEL KARTU FITUR 3x2 + MENU LAIN ---------- */
.pn{
  background:var(--surface);
  border:1px solid #E6ECFC;
  border-radius:26px;
  padding:15px;
  margin-top:18px;
  display:block;
  box-shadow:0 8px 24px rgba(24,54,111,.06);
}
.tg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
}
.tl{
  border-radius:20px;
  padding:12px 6px 13px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:132px;
  transition:transform .16s ease, box-shadow .16s ease;
  border:1px solid rgba(255,255,255,.7);
}
.tl:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 18px rgba(20,43,98,.08);
}
.tl:active{transform:scale(.97)}
/* Warna latar lembut per kartu persis referensi */
.tl.t-sky{background:linear-gradient(180deg,#EDF4FF 0%,#E3EEFF 100%)}
.tl.t-amber{background:linear-gradient(180deg,#FFF7EA 0%,#FDEFD9 100%)}
.tl.t-violet{background:linear-gradient(180deg,#F1EEFF 0%,#E7E2FF 100%)}
.tl.t-ice{background:linear-gradient(180deg,#EFF5FF 0%,#E5EFFF 100%)}
.tl.t-lav{background:linear-gradient(180deg,#F2EFFF 0%,#E8E3FF 100%)}
.tl.t-peach{background:linear-gradient(180deg,#FFF6EC 0%,#FCEEDD 100%)}

.tl .i3{
  width:66px;
  height:66px;
  filter:drop-shadow(0 6px 8px rgba(23,45,98,.14));
}
.tl b{
  font-size:13.5px;
  font-weight:800;
  line-height:1.2;
  color:#163269;
  letter-spacing:-.01em;
}

/* Tombol Pill Menu Lain */
.ml{
  display:flex;
  align-items:center;
  gap:12px;
  background:#E7EEFF;
  border-radius:99px;
  padding:13px 18px;
  margin-top:13px;
  font-weight:800;
  color:var(--brand);
  transition:background .15s ease;
}
.ml:hover{background:#DCE6FF}
.ml .dots-ico{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.ml .dots-ico span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#226CE8;
}
.ml .dots-ico span:nth-child(2){opacity:.75}
.ml .dots-ico span:nth-child(3){opacity:.5}
.ml b{
  flex:1;
  color:#163269;
  font-size:14.5px;
}
.ml .chev{
  font-size:18px;
  font-weight:700;
  color:#1E60D5;
}

/* ---------- JUDUL SEKSI ---------- */
.sech{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 2px 12px;
  gap:10px;
}
.sech-title{
  display:flex;
  align-items:center;
  gap:8px;
}
.sech h2{
  margin:0;
  font-size:19.5px;
  font-weight:800;
  letter-spacing:-.025em;
  color:#153168;
}
.sech a{
  background:#E6EEFF;
  color:#1764DF;
  font-weight:700;
  font-size:13px;
  padding:7px 14px;
  border-radius:99px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  transition:background .15s ease;
}
.sech a:hover{background:#D9E5FF}

/* ---------- REKOMENDASI UNTUKMU (BANNER UNGU-BIRU MODERN) ---------- */
.rc{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.rc::-webkit-scrollbar{display:none}
.sl{
  flex:none;
  width:100%;
  scroll-snap-align:start;
  background:linear-gradient(125deg, #27299C 0%, #3F4AD8 52%, #1D74E8 100%);
  color:#fff;
  border-radius:24px;
  padding:18px 20px;
  min-height:184px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:9px;
  box-shadow:0 12px 26px rgba(33,52,158,.22);
}
.sl::before{
  content:"";
  position:absolute;
  right:-30px;
  bottom:-75px;
  width:210px;
  height:210px;
  border:1.5px solid rgba(255,255,255,.16);
  border-radius:50%;
  box-shadow:0 0 0 24px rgba(255,255,255,.06), 0 0 0 50px rgba(255,255,255,.04);
  pointer-events:none;
}
.sl .kk{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.25);
  border-radius:99px;
  padding:4px 12px;
  font-size:12.5px;
  font-weight:700;
}
.sl h3{
  margin:0;
  font-size:21px;
  font-weight:800;
  line-height:1.22;
  max-width:65%;
  letter-spacing:-.02em;
  position:relative;
  z-index:1;
}
.sl .bt{
  background:#fff;
  color:#1D2A8A;
  font-weight:800;
  border-radius:99px;
  padding:9px 18px;
  font-size:13.5px;
  margin-top:auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  box-shadow:0 4px 12px rgba(13,22,84,.22);
  position:relative;
  z-index:1;
}
.sl .i3{
  position:absolute;
  right:14px;
  top:28px;
  width:106px;
  height:106px;
  filter:drop-shadow(0 10px 14px rgba(12,20,82,.35));
}
.dots{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:11px;
}
.dots i{
  width:24px;
  height:7px;
  border-radius:99px;
  background:#CBD6EE;
  transition:all .2s ease;
}
.dots i.on{
  width:32px;
  background:var(--brand);
}

/* ---------- MISI HARIAN ---------- */
.ms{
  display:flex;
  align-items:center;
  gap:12px;
  background:linear-gradient(135deg,#E6EEFF 0%,#EDF3FF 100%);
  border:1px solid #D7E3FF;
  border-radius:22px;
  padding:14px 15px;
  box-shadow:0 6px 18px rgba(25,57,122,.06);
  transition:transform .15s ease;
}
.ms:hover{transform:translateY(-2px)}
.ms div{flex:1;min-width:0}
.ms b{display:block;font-size:15px;font-weight:800;color:#153168}
.ms small{color:#5A6E96;font-size:12.5px;font-weight:500}
.ms .mp{width:62px;flex:none;background:#C8D8FA;margin:0;height:8px}
.ms .mp i{background:linear-gradient(90deg,#1E6CEB,#3B82F6)}
.ms em{font-style:normal;font-weight:800;font-size:13.5px;color:#153168}

/* ---------- NAVIGASI BAWAH ---------- */
.tab{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid #E3EAFB;
  box-shadow:0 -8px 24px rgba(24,54,111,.07);
  border-radius:22px 22px 0 0;
  display:flex;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
}
.tab a{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11.5px;
  font-weight:700;
  color:#7A8BAE;
  padding:4px;
  position:relative;
}
.tab a[aria-current=page]{color:var(--brand)}
.tab a[aria-current=page]::after{
  content:"";
  width:36px;
  height:3px;
  border-radius:99px;
  background:var(--brand);
  margin-top:2px;
}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- SUB-HALAMAN (LATIHAN, AGENDA, STATISTIK, PENCAPAIAN, MENU) ---------- */
.sh{display:flex;align-items:center;gap:10px;margin:20px 0 8px}
.sh a{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--ink)}
.sh h2{margin:0;font-size:20px;font-weight:800;color:#153168}
.em{padding:26px 16px;text-align:center;color:var(--ink3);background:#fff;border:1px dashed #C7D4EE;border-radius:20px;margin-top:12px}
.hn{color:var(--ink3);font-size:13px;margin:12px 4px}
.er{background:#FDECEA;color:#7E2118;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.rw small,.sc small,.lv small,.bd small,.ag small{display:block;color:var(--ink3);font-size:13px}
.rw b{display:block;font-weight:700}
.tg2{display:inline-block;margin-top:8px;background:#E6EEFF;color:var(--brand);font-weight:700;font-size:13px;padding:5px 13px;border-radius:99px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{text-align:center}.sc b{font-size:28px;font-weight:800;color:var(--brand)}
.bars{display:flex;gap:8px;align-items:flex-end;height:140px}
.bars span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars i{width:100%;background:linear-gradient(180deg,#2A7BF6,#1764DF);border-radius:8px 8px 3px 3px;display:block}
.bars small{font-size:12px;margin-top:4px;font-weight:700}
.lv,.bd,.ag{display:flex;align-items:center;gap:12px}
.lv div,.bd div,.ag span{flex:1;min-width:0}
.lv b{font-size:22px;font-weight:800}
.lv .mp,.mp{background:#DCE5F6}
.bd.lk{opacity:.55}
.bd em{font-style:normal;font-size:12px;font-weight:800;color:var(--brand)}
.fm{display:flex;flex-direction:column;gap:8px}
.fm input,.bt2{width:100%;padding:12px 14px;border:1px solid #d6dce7;border-radius:13px;font-size:15px}
.bt2{background:var(--brand);color:#fff;font-weight:800;border:0;text-align:center;display:block;margin-top:12px;cursor:pointer}
.ag input{width:22px;height:22px}
.ag button{border:0;background:transparent;font-size:18px;color:#B3372B}
.ag.dn b{text-decoration:line-through;opacity:.55}
.qq b{display:block;margin-bottom:6px}
.ch{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px;cursor:pointer}
.ch input{width:20px;height:20px;flex:none}
.ch.ok{border-color:#8fd1ae;background:#eefaf3}
.ch.no{border-color:#e6bcbc;background:#fff0f0}
.rs{text-align:center}.rs b{font-size:46px;font-weight:800;color:var(--brand)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item{background:#fff;border-radius:18px;padding:13px}
.item h3{margin:0;font-size:15px}
.item p{margin:4px 0 0;font-size:13px;color:#4A566B}
.vid{margin-top:10px}figure.att{margin:0}

@media(min-width:700px){
  .wrap,.sr-wrap{max-width:860px}
  .tg{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .tl{min-height:146px}
  .rc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}
  .sl{width:auto}
}
@media(max-width:380px){
  .pg{width:116px;padding:9px}
  .pg b{font-size:22px}
  .big{width:60px;height:60px;font-size:21px}
  .tl .i3{width:56px;height:56px}
  .tl b{font-size:12.5px}
}
</style>
</head>
<body>
<header class="hd">
  <div class="wrap">
    <div class="top">
      <span class="top-logo" id="lg"></span>
      <b data-kb-name>KawanBelajarku</b>
      <a class="av" id="av" href="#/menu" aria-label="Menu akun">?</a>
    </div>
    <div class="me">
      <div class="big" id="avB">?</div>
      <div class="mi">
        <h1 id="nm">Memuat…</h1>
        <span class="pill" id="rl">Siswa</span>
        <div class="st" id="stt"></div>
      </div>
      <a class="pg" href="#/statistik">
        <small>Progres Belajar</small>
        <b id="pc">0%</b>
        <i><u id="pb" style="width:0"></u></i>
      </a>
    </div>
    <div class="wl" data-kb-welcome></div>
  </div>
</header>

<div class="sr-wrap">
  <div class="sr">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" autocomplete="off" placeholder="Cari materi, latihan, atau topik…">
  </div>
</div>

<main class="wrap" id="view"><div class="em">Memuat…</div></main>

<nav class="tab">
  <a href="#/" data-t="b">
    <svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-8h6v8"/></svg>
    Beranda
  </a>
  <a href="/pelajaran.html">
    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    Pelajaran
  </a>
  <a href="#/pencapaian" data-t="c">
    <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>
    Pencapaian
  </a>
  <a href="#/menu" data-t="m">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    Menu Lain
  </a>
</nav>

<script>
const db=window.supabase.createClient('https://zqjsvihbqmmpnrhuvtyc.supabase.co','sb_publishable_7GAjjaWrZBLFjEPuiKCd4A_2dKWgnlM');
const $=id=>document.getElementById(id),esc=KB.esc,I=KB.icon;
let U,P,Q=null,X={},D={sub:[],mat:[],qz:[],res:[],prog:[],fea:[],att:[]},err='';
const adm=()=>P?.role==='admin',sn=id=>D.sub.find(s=>String(s.id)===String(id))?.name||'',enc=encodeURIComponent;
const day=d=>{const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()};
const sub=(t,h)=>`<div class="sh"><a href="#/" aria-label="Kembali">‹</a><h2>${t}</h2></div>${h}`;
const po=o=>{if(Array.isArray(o))return o.map(x=>String(x??''));if(typeof o==='string'){try{const j=JSON.parse(o);if(Array.isArray(j))return j.map(x=>String(x??''));if(j&&typeof j==='object')return Object.values(j).map(String)}catch(e){}return o.split('\n').map(x=>x.trim()).filter(Boolean)}return o&&typeof o==='object'?Object.values(o).map(String):[]};
const ci=q=>{const o=po(q.options),c=String(q.correct_answer??'').trim();if(!c)return-1;let i=o.findIndex(x=>x.trim().toLowerCase()===c.toLowerCase());if(i>=0)return i;if(/^[A-Za-z]$/.test(c)){i=c.toUpperCase().charCodeAt(0)-65;return i<o.length?i:-1}if(/^\d+$/.test(c)){i=+c;return i<o.length?i:-1}return-1};

async function load(){
 const q=(t,s)=>db.from(t).select(s),u=U.id;
 const r=await Promise.all([
  q('subjects','id,name'),
  q('materials','id,subject_id,title,description,created_at').order('created_at',{ascending:false}),
  q('quizzes','id,subject_id,title,description,created_at').order('created_at',{ascending:false}),
  q('quiz_results','id,quiz_id,score,completed_at').eq('student_id',u).order('completed_at',{ascending:false}),
  q('progress','material_id,completed').eq('student_id',u),
  q('features','*').order('created_at'),
  q('attachments','*').order('created_at',{ascending:false})
 ]);
 [D.sub,D.mat,D.qz,D.res,D.prog,D.fea,D.att]=r.map(x=>x.data||[]);
 err=r.slice(0,4).map(x=>x.error?.message).filter(Boolean)[0]||'';
 const ids=new Set(D.mat.map(m=>String(m.id))),done=new Set(D.prog.filter(p=>p.completed&&ids.has(String(p.material_id))).map(p=>String(p.material_id))),best={};
 D.res.forEach(x=>{best[x.quiz_id]=Math.max(best[x.quiz_id]||0,+x.score||0)});
 const days=new Set(D.res.map(x=>day(x.completed_at))),xp=done.size*10+Object.values(best).reduce((s,v)=>s+v,0);
 X={done,best,days,xp,lvl:Math.floor(xp/100)+1,gold:50*days.size+5*done.size,pct:D.mat.length?Math.round(done.size/D.mat.length*100):0,today:days.has(day(new Date()))};
 $('stt').textContent=`${X.done.size} materi selesai • ${D.res.length} kuis dikerjakan`;
 $('pc').textContent=X.pct+'%';
 $('pb').style.width=X.pct+'%';
}

const tiles=[
 ['Materi Tersimpan','folder','t-sky','/pelajaran.html#/tersimpan'],
 ['Pusat Latihan','clip','t-amber','#/latihan'],
 ['Agenda Belajar','cal','t-violet','#/agenda'],
 ['Statistik Belajar','chart','t-ice','#/statistik'],
 ['Pilihan Minggu Ini','video','t-lav','#/pilihan'],
 ['Pencapaian','crown','t-peach','#/pencapaian']
];

function slides(){
 const s=[];
 D.att.filter(a=>a.kind==='video').slice(0,3).forEach(a=>s.push({
  k:'Video Edukasi',
  t:a.title||'Tonton video',
  b:'Tonton Sekarang',
  h:`/pelajaran.html#/${a.owner_type==='material'?'materi':'fitur'}/${enc(a.owner_id)}`,
  i:'video'
 }));
 D.mat.slice(0,3-s.length).forEach(m=>s.push({
  k:'Materi Baru',
  t:m.title,
  b:'Baca Sekarang',
  h:'/pelajaran.html#/materi/'+enc(m.id),
  i:'book'
 }));
 if(!s.length)s.push({
  k:'Mulai Belajar',
  t:'Materi akan muncul di sini',
  b:'Buka Pelajaran',
  h:'/pelajaran.html',
  i:'books'
 });
 return s;
}

function home(){
 const s=slides();
 return (err?`<div class="er">Sebagian data gagal dimuat: ${esc(err)}</div>`:'')+
 `<section class="pn">
   <div class="tg">${tiles.map(([t,i,cls,h])=>`<a class="tl ${cls}" href="${h}">${I(i,66)}<b>${t}</b></a>`).join('')}</div>
   <a class="ml" href="#/menu"><span class="dots-ico"><span></span><span></span><span></span></span><b>Menu Lain</b><span class="chev">›</span></a>
 </section>
 <div class="sech">
   <div class="sech-title">${I('star',24)}<h2>Rekomendasi Untukmu</h2></div>
   <a href="#/pilihan">Lihat Semua ›</a>
 </div>
 <div class="rc" id="rc">${s.map(x=>`<a class="sl" href="${x.h}"><span class="kk">▶ ${x.k}</span><h3>${esc(x.t)}</h3><span class="bt">${x.b} ▶</span>${I(x.i,106)}</a>`).join('')}</div>
 <div class="dots" id="dots">${s.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
 <div class="sech">
   <div class="sech-title">${I('target',24)}<h2>Misi Harian</h2></div>
   <a href="#/latihan">Lihat Detail ›</a>
 </div>
 <a class="ms" href="#/latihan">
   ${I('target',52)}
   <div><b>Selesaikan 1 kuis hari ini!</b><small>Catat progres latihanmu hari ini</small></div>
   <span class="mp"><i style="width:${X.today?100:0}%"></i></span>
   <em>${X.today?1:0} / 1</em>
   ${I('gift',48)}
 </a>`;
}

function latih(){
 return sub('Pusat Latihan',D.qz.length?D.qz.map(q=>{
  const r=D.res.find(x=>String(x.quiz_id)===String(q.id));
  return `<a class="pn rw" href="#/kuis/${enc(q.id)}"><small>${esc(sn(q.subject_id))}</small><b>${esc(q.title)}</b>${q.description?`<small>${esc(q.description)}</small>`:''}<span class="tg2">${r?'Skor terakhir '+r.score+' · Kerjakan lagi':'Kerjakan'}</span></a>`;
 }).join(''):'<div class="em">Belum ada kuis.</div>');
}

async function kuis(id){
 const q=D.qz.find(x=>String(x.id)===id);
 if(!q)return sub('Kuis','<div class="em">Kuis tidak ditemukan.</div>');
 const r=await db.from('questions').select('question_text,options,correct_answer').eq('quiz_id',q.id),qs=(r.data||[]).filter(x=>po(x.options).length>1&&ci(x)>=0);
 Q={q,qs};
 if(!qs.length)return sub(esc(q.title),'<div class="em">Kuis ini belum punya soal yang siap dikerjakan.</div>');
 return sub(esc(q.title),`<p class="hn">${esc(q.description||'')}</p><form id="qf">${qs.map((x,i)=>`<div class="pn qq"><b>${i+1}. ${esc(x.question_text)}</b>${po(x.options).map((o,j)=>`<label class="ch"><input type="radio" name="a${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</div>`).join('')}<button class="bt2">Kumpulkan jawaban</button><div id="qr"></div></form>`);
}

async function submitQ(e){
 e.preventDefault();
 const{q,qs}=Q,a=qs.map((_,i)=>{const c=document.querySelector(`input[name=a${i}]:checked`);return c?+c.value:-1}),m=a.indexOf(-1);
 if(m>=0)return $('qr').innerHTML=`<div class="er">Soal nomor ${m+1} belum dijawab.</div>`;
 let ok=0;qs.forEach((x,i)=>{if(a[i]===ci(x))ok++});
 const score=Math.round(ok/qs.length*100),first=!X.today;
 const r=await db.from('quiz_results').insert({student_id:U.id,quiz_id:q.id,score,completed_at:new Date().toISOString()}).select();
 if(r.error||!r.data?.length)return $('qr').innerHTML=`<div class="er">Skor gagal tersimpan: ${esc(r.error?.message||'izin ditolak')}</div>`;
 document.querySelectorAll('#qf .qq').forEach((bx,i)=>bx.querySelectorAll('.ch').forEach((lb,j)=>{
  lb.querySelector('input').disabled=true;
  if(j===ci(qs[i]))lb.classList.add('ok');
  else if(j===a[i])lb.classList.add('no');
 }));
 e.submitter.hidden=true;
 $('qr').innerHTML=`<div class="pn rs"><b>${score}</b><div>Benar ${ok} dari ${qs.length}.${first?' Misi harian selesai, +50 Gold!':''}</div><a class="bt2" href="#/latihan">Kembali ke latihan</a></div>`;
 await load();
}

const AK=()=>'kb:agenda:'+U.id,ag=()=>{try{return JSON.parse(localStorage.getItem(AK())||'[]')}catch(e){return[]}},sag=a=>{try{localStorage.setItem(AK(),JSON.stringify(a))}catch(e){}};
function agenda(){
 const a=ag().sort((x,y)=>(x.d||'9').localeCompare(y.d||'9')||x.id-y.id);
 return sub('Agenda Belajar',`<form class="pn fm" id="agf"><input id="agt" placeholder="Rencana belajar, mis. Latihan bab 2" maxlength="100" required><input id="agd" type="date"><button class="bt2" style="margin:0">Tambah</button></form>`+(a.length?a.map(x=>`<div class="pn ag${x.done?' dn':''}"><input type="checkbox" data-ag="${x.id}" ${x.done?'checked':''}><span><b>${esc(x.t)}</b><small>${x.d?new Date(x.d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'}):'Tanpa tanggal'}</small></span><button data-agx="${x.id}" aria-label="Hapus">✕</button></div>`).join(''):'<div class="em">Belum ada agenda. Tambahkan rencana belajarmu.</div>')+'<p class="hn">Agenda tersimpan di perangkat ini.</p>');
}

function stat(){
 const n=D.res.length,avg=n?Math.round(D.res.reduce((s,r)=>s+(+r.score||0),0)/n):0,l=D.res.slice(0,8).reverse();
 return sub('Statistik Belajar',`<div class="g2"><div class="pn sc"><b>${X.done.size}/${D.mat.length}</b><small>Materi selesai</small></div><div class="pn sc"><b>${n}</b><small>Kuis dikerjakan</small></div><div class="pn sc"><b>${avg}</b><small>Rata-rata skor</small></div><div class="pn sc"><b>${X.pct}%</b><small>Progres belajar</small></div></div><div class="sech"><h2>Skor terakhir</h2></div><div class="pn">${l.length?`<div class="bars">${l.map(r=>`<span><i style="height:${Math.max(4,r.score)}%"></i><small>${r.score}</small></span>`).join('')}</div>`:'<div class="em" style="margin:0">Belum ada kuis yang dikerjakan.</div>'}</div><p class="hn">Tandai materi selesai di halaman Pelajaran untuk menaikkan progres.</p>`);
}

function capai(){
 const pr=X.xp%100,B=[
  ['Kuis pertama',D.res.length>=1,'Selesaikan 1 kuis'],
  ['Skor sempurna',Object.values(X.best).some(v=>v>=100),'Raih skor 100'],
  ['Rajin membaca',X.done.size>=5,'Tandai 5 materi selesai'],
  ['Tiga hari belajar',X.days.size>=3,'Kerjakan kuis di 3 hari berbeda']
 ];
 return sub('Pencapaian',`<div class="pn lv">${I('crown',68)}<div><b>Level ${X.lvl}</b><small>${X.xp} XP · ${X.gold} Gold</small><span class="mp"><i style="width:${pr}%"></i></span><small>${100-pr} XP lagi ke level ${X.lvl+1}</small></div></div><div class="sech"><h2>Lencana</h2></div>`+B.map(([t,o,d])=>`<div class="pn bd${o?'':' lk'}">${I(o?'star':'books',48)}<div><b>${t}</b><small>${d}</small></div><em>${o?'Didapat':'Terkunci'}</em></div>`).join('')+'<p class="hn">XP: 10 per materi selesai + skor terbaik tiap kuis. Gold: 50 per hari mengerjakan kuis + 5 per materi selesai.</p>');
}

function pilih(){
 const v=D.att.filter(a=>a.kind==='video');
 return sub('Pilihan Minggu Ini',(v.length?`<div class="sech"><h2>Video</h2></div>${v.slice(0,6).map(a=>KB.attView(a)).join('')}`:'')+'<div class="sech"><h2>Materi terbaru</h2></div>'+(D.mat.length?D.mat.slice(0,6).map(m=>`<a class="pn rw" href="/pelajaran.html#/materi/${enc(m.id)}"><b>${esc(m.title)}</b><small>${esc(sn(m.subject_id))}</small></a>`).join(''):'<div class="em">Belum ada materi.</div>'));
}

function menu(){
 const t=[['Materi Tersimpan','/pelajaran.html#/tersimpan'],['Semua Pelajaran','/pelajaran.html']];
 if(adm())t.push(['Kelola data (admin)','/kelola.html'],['Editor tampilan & fitur (admin)','/editor.html']);
 return sub('Menu Lain',`<div class="pn"><b>${esc(P.full_name||U.email)}</b><div class="hn" style="margin:2px 0 0">${esc(U.email)} · ${adm()?'Admin':'Siswa'}</div></div>`+(D.fea.length?`<div class="sech"><h2>Fitur</h2></div><div class="gr">${KB.featCards(D.fea)}</div>`:'')+t.map(([a,h])=>`<a class="pn rw" href="${h}"><b>${a}</b></a>`).join('')+'<button class="bt2" id="lo">Keluar</button>');
}

function search(t){
 const k=t.toLowerCase(),h=(a,b)=>(a+' '+(b||'')).toLowerCase().includes(k);
 const s=D.sub.filter(x=>h(x.name)).map(x=>[`/pelajaran.html#/mapel/${enc(x.id)}`,x.name,'Mata pelajaran']),
       m=D.mat.filter(x=>h(x.title,x.description)).map(x=>[`/pelajaran.html#/materi/${enc(x.id)}`,x.title,'Materi · '+sn(x.subject_id)]),
       z=D.qz.filter(x=>h(x.title,x.description)).map(x=>[`#/kuis/${enc(x.id)}`,x.title,'Latihan']);
 const a=[...s,...m,...z];
 return `<div class="sech"><h2>Hasil pencarian</h2><span>${a.length}</span></div>`+(a.length?a.map(([l,b,c])=>`<a class="pn rw" href="${l}"><small>${esc(c)}</small><b>${esc(b)}</b></a>`).join(''):`<div class="em">Tidak ada hasil untuk “${esc(t)}”.</div>`);
}

async function route(){
 const[p,id]=location.hash.replace(/^#\/?/,'').split('/'),t=$('q').value.trim(),v=$('view');
 let h;
 if(t&&!p)h=search(t);
 else if(p==='latihan')h=latih();
 else if(p==='agenda')h=agenda();
 else if(p==='statistik')h=stat();
 else if(p==='pencapaian')h=capai();
 else if(p==='pilihan')h=pilih();
 else if(p==='menu')h=menu();
 else if(p==='kuis'){v.innerHTML='<div class="em">Memuat soal…</div>';h=await kuis(decodeURIComponent(id||''))}
 else h=home();
 v.innerHTML=h;
 const c=p==='pencapaian'?'c':p==='menu'?'m':p||t?'':'b';
 document.querySelectorAll('.tab a[data-t]').forEach(a=>a.setAttribute('aria-current',a.dataset.t===c?'page':'false'));
 const rc=$('rc');
 if(rc)rc.addEventListener('scroll',()=>{
  const i=Math.round(rc.scrollLeft/rc.clientWidth);
  document.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',i===j));
 });
}

const view=$('view');
view.addEventListener('submit',e=>{
 if(e.target.id==='qf')submitQ(e);
 else if(e.target.id==='agf'){
  e.preventDefault();
  const a=ag();
  a.push({id:Date.now(),t:$('agt').value.trim(),d:$('agd').value,done:false});
  sag(a);
  route();
 }
});
view.addEventListener('change',e=>{
 const i=e.target.dataset.ag;
 if(i){sag(ag().map(x=>String(x.id)===i?{...x,done:e.target.checked}:x));route()}
});
view.addEventListener('click',async e=>{
 const x=e.target.closest('[data-agx]');
 if(x){sag(ag().filter(y=>String(y.id)!==x.dataset.agx));route()}
 if(e.target.id==='lo'){await db.auth.signOut();location.replace('/')}
});
$('q').addEventListener('input',()=>{if(location.hash.length>2)location.hash='#/';else route()});
addEventListener('hashchange',route);

(async()=>{
 const{data:{session}}=await db.auth.getSession();
 if(!session)return location.replace('/');
 U=session.user;
 const{data:p}=await db.from('profiles').select('full_name,role').eq('id',U.id).maybeSingle();
 if(!p){view.innerHTML='<div class="er">Profil akun belum ditemukan. Hubungi admin.</div>';return}
 P=p;
 const nm=p.full_name||U.email||'Pengguna',ini=nm.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
 $('nm').textContent=nm;
 $('rl').textContent=adm()?'Admin':'Siswa';
 $('av').textContent=ini;
 $('avB').textContent=ini;
 $('lg').innerHTML=I('book',24);
 await KB.load(db);
 await load();
 route();
})().catch(e=>{view.innerHTML=`<div class="er">Terjadi kesalahan: ${esc(e.message||e)}</div>`});
</script>
